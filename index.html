admin=function(){if(sessionStorage.getItem('admin')!=='1')return `<main class="login"><div class="login-language"><select class="language-select" onchange="v2setLang(this.value)"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select></div><div class="loginvisual"><img src="/assets/hero.webp"><b class="logo">VETRA ◆</b></div><div class="loginbox"><form onsubmit="login(event)"><span class="eye">PRIVATE ACCESS</span><h1>Welcome back.</h1><p>Manage stores, products and the market mood.</p><label>Username<input class="input" name="user"></label><br><label>Password<input class="input" type="password" name="pass"></label><p id="err" style="color:#a33"></p><button class="btn dark" style="width:100%">Enter dashboard →</button><small>Demo access: Admin / 2009</small></form></div></main>`;let t=ui.tab||'overview',tabs=[['overview','Overview'],['catalog','Catalog'],['media','Media'],['homepage','Homepage'],['orders','Orders'],['themes','Themes'],['settings','Settings']];return `<main class="admin"><aside class="sidebar"><a data-go href="/" class="logo">${E(data.settings.name)} ◆</a>${tabs.map(x=>`<button class="${t===x[0]?'on':''}" onclick="ui.tab='${x[0]}';ui.openProduct='';render()">${x[1]}</button>`).join('')}<button onclick="sessionStorage.clear();go('/0')">Sign out</button></aside><section class="adminmain"><header class="adminhead"><div><span class="eye">MARKETPLACE ADMIN</span><h1>${tabs.find(x=>x[0]===t)?.[1]}</h1></div><b>Admin · v2.1</b></header><div class="admincontent">${adminContent(t)}</div></section></main>`};
adminContent=function(t){if(t==='overview')return v2overview();if(t==='catalog')return v2catalog();if(t==='media')return v2media();if(t==='homepage')return v2homepage();if(t==='orders')return v2orders();if(t==='themes')return v2themes();return v2settings()};
function v2overview(){let pics=v2mediaEntries().length;return `<div class="adminbar"><div><span class="eye">Overview</span><h2>Everything at a glance.</h2></div><button class="btn dark" onclick="ui.tab='catalog';render()">Catalog →</button></div><div class="stats"><div class="stat"><small>Stores</small><strong>${data.stores.length}</strong></div><div class="stat"><small>Products</small><strong>${data.products.length}</strong></div><div class="stat"><small>Pictures</small><strong>${pics}</strong></div><div class="stat"><small>Variants</small><strong>${data.products.reduce((n,p)=>n+v2variants(p),0)}</strong></div></div><div class="hint"><b>Catalog hierarchy</b> · Store → Products → Product information → Pictures + Variants</div>`}
function v2catalog(){return `<div class="adminbar"><div><span class="eye">Catalog hierarchy</span><h2>Stores & products</h2></div><div class="admin-actions"><button class="btn dark" onclick="v2addStore()">+ Add store</button></div></div><div class="hint"><b>Store</b> → Products of the store → Product information → Pictures + Variants</div><div class="tree">${data.stores.map(v2storeNode).join('')}</div>`}
function v2storeNode(s){let open=ui.openStore===s.id,ps=data.products.filter(p=>p.store===s.id);return `<section class="store-node"><div class="node-top"><button class="node-main" onclick="ui.openStore=ui.openStore==='${s.id}'?'':'${s.id}';ui.openProduct='';render()"><img src="${E(v2img(s.cover))}"><span><strong>${E(s.name)}</strong><small>${E(s.city)} · ${ps.length} products</small></span><b>${open?'−':'+'}</b></button><div class="node-actions"><button class="btn" onclick="v2editStore('${s.id}')">Edit store</button><button class="btn" onclick="v2addProduct('${s.id}')">+ Add product</button><button class="btn danger" onclick="v2deleteStore('${s.id}')">Delete store</button></div></div>${open?`<div class="store-body"><div class="store-summary"><img src="${E(v2img(s.cover))}"><div><span class="eye">Store</span><p><b>${E(s.name)}</b> · ${E(s.cat)} · ${E(s.city)}</p><p>${E(s.desc)}</p><p>${E(s.phone)} · ${E(s.email)} · WhatsApp ${E(s.wa)}</p></div></div><div class="products-tree">${ps.length?ps.map(v2productNode).join(''):`<div class="empty-admin">No products in this store yet.</div>`}</div></div>`:''}</section>`}
function v2productNode(p){let open=ui.openProduct===p.id;return `<article class="product-node"><div class="product-top"><button class="product-main" onclick="ui.openProduct=ui.openProduct==='${p.id}'?'':'${p.id}';render()"><img src="${E(v2img(p.colors[0]?.images[0]))}"><span><strong>${E(p.name)}</strong><small>${p.colors.length} colors · ${v2variants(p)} variants</small></span><b>${open?'−':'+'}</b></button><div class="product-actions"><button class="btn" onclick="v2editProduct('${p.id}')">Edit product</button><button class="btn danger" onclick="v2deleteProduct('${p.id}')">Delete product</button></div></div>${open?v2productDetail(p):''}</article>`}
function v2productDetail(p){return `<div class="product-detail-admin"><div class="adminbar"><div><span class="eye">Product information</span><h3>${E(p.name)}</h3></div><div class="admin-actions"><button class="btn" onclick="v2editProduct('${p.id}')">Edit product</button><button class="btn dark" onclick="v2addColor('${p.id}')">+ Add color</button></div></div><div class="info-grid"><div class="info-tile"><small>Store</small><strong>${E(S(p.store).name)}</strong></div><div class="info-tile"><small>Price</small><strong>${money(p.sale||p.base)}</strong></div><div class="info-tile"><small>Category</small><strong>${E(p.cat)}</strong></div><div class="info-tile info-wide"><small>Description</small><strong>${E(p.desc)}</strong></div></div><div class="colors-admin">${p.colors.map((c,ci)=>v2colorPanel(p,c,ci)).join('')}</div></div>`}
function v2colorPanel(p,c,ci){return `<section class="color-panel"><div class="color-head"><i class="swatch-admin" style="background:${E(c.hex)}"></i><h4>${E(c.name)} · ${c.images.length} pictures · ${c.sizes.length} variants</h4><div class="color-actions"><button class="btn" onclick="v2editColor('${p.id}',${ci})">Edit</button><button class="btn" onclick="v2addImage('${p.id}',${ci})">+ Add picture</button><label class="btn">Upload<input hidden type="file" accept="image/*" onchange="v2uploadImage(event,'${p.id}',${ci},-1)"></label><button class="btn" onclick="v2addVariant('${p.id}',${ci})">+ Add variant</button>${p.colors.length>1?`<button class="btn danger" onclick="v2deleteColor('${p.id}',${ci})">Delete</button>`:''}</div></div><span class="eye">Pictures</span><div class="picture-grid-admin">${c.images.map((u,ii)=>v2picture(p.id,ci,ii,u)).join('')}<label class="upload-btn">＋<br>Add picture<input type="file" accept="image/*" onchange="v2uploadImage(event,'${p.id}',${ci},-1)"></label></div><span class="eye" style="display:block;margin-top:12px">Variants</span><div class="variant-wrap"><table class="variant-table"><thead><tr><th>Size</th><th>SKU</th><th>Stock</th><th>Price</th><th>Actions</th></tr></thead><tbody>${c.sizes.map((v,vi)=>`<tr><td>${E(v.n||v.name)}</td><td>${E(v.sku)}</td><td>${v.stock}</td><td>${v.price?money(v.price):'—'}</td><td><button onclick="v2editVariant('${p.id}',${ci},${vi})">Edit</button> <button class="danger" onclick="v2deleteVariant('${p.id}',${ci},${vi})">Delete</button></td></tr>`).join('')}</tbody></table></div></section>`}
function v2picture(pid,ci,ii,u){return `<article class="picture-card"><img src="${E(v2img(u))}"><div class="picture-copy"><small>${E(u.split('/').pop()||'Image')}</small><div class="picture-actions"><button onclick="v2replaceImage('${pid}',${ci},${ii})">Replace</button><label>Upload<input type="file" accept="image/*" onchange="v2uploadImage(event,'${pid}',${ci},${ii})"></label><button class="danger" onclick="v2deleteImage('${pid}',${ci},${ii})">Delete</button></div></div></article>`}
function v2mediaEntries(){let a=[{key:'hero',url:data.settings.heroImage,label:'Homepage hero',group:'Main page'},{key:'logo',url:data.settings.logo||V2PH,label:'Website logo',group:'Main page'}];data.stores.forEach(s=>{a.push({key:`cover|${s.id}`,url:v2img(s.cover),label:s.name,group:'Store cover'});a.push({key:`storelogo|${s.id}`,url:v2img(s.logo),label:s.name,group:'Store logo'})});data.products.forEach(p=>p.colors.forEach((c,ci)=>c.images.forEach((u,ii)=>a.push({key:`product|${p.id}|${ci}|${ii}`,url:v2img(u),label:`${p.name} · ${c.name}`,group:'Product picture'}))));return a}
function v2media(){let a=v2mediaEntries();return `<div class="adminbar"><div><span class="eye">Media</span><h2>All website pictures</h2></div><div class="admin-actions"><button class="btn" onclick="ui.tab='homepage';render()">Main page</button><button class="btn dark" onclick="ui.tab='catalog';render()">Products</button></div></div><div class="media-tools"><input class="input" placeholder="Search pictures" oninput="v2filterMedia(this.value)"><span>${a.length} pictures</span></div><div class="media-grid-admin">${a.map(v2mediaCard).join('')}</div>`}
function v2mediaCard(x){return `<article class="media-card" data-search="${E((x.label+' '+x.group).toLowerCase())}"><img src="${E(x.url)}"><div class="media-copy"><h4>${E(x.label)}</h4><p>${E(x.group)}</p><div class="media-actions"><button onclick="v2replaceMedia('${x.key}')">Replace</button><label>Upload<input type="file" accept="image/*" onchange="v2uploadMedia(event,'${x.key}')"></label><button class="danger" onclick="v2deleteMedia('${x.key}')">Delete</button></div></div></article>`}
function v2filterMedia(q){document.querySelectorAll('[data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q.toLowerCase())?'':'none')}
function v2homepage(){return `<div class="adminbar"><div><span class="eye">Homepage</span><h2>Homepage editor</h2></div></div><div class="home-editor"><form class="adminform" onsubmit="v2saveHome(event)"><h2>Main page</h2><label class="full">Announcement<input name="notice" value="${E(data.settings.notice)}"></label><label class="full">Hero headline<textarea name="title">${E(data.settings.heroTitle)}</textarea></label><label class="full">Hero introduction<textarea name="text">${E(data.settings.heroText)}</textarea></label><label class="full">Hero image URL<input name="hero" value="${E(data.settings.heroImage)}"></label><div class="formactions"><label class="btn">Upload<input hidden type="file" accept="image/*" onchange="v2uploadMedia(event,'hero')"></label><button type="button" class="btn danger" onclick="v2deleteMedia('hero')">Delete</button><button class="btn dark">Save homepage</button></div></form><aside class="home-preview"><img src="${E(v2img(data.settings.heroImage))}"><div><span class="eye">Main page</span><h3>${E(data.settings.heroTitle)}</h3><p>${E(data.settings.heroText)}</p></div></aside></div>`}
function v2orders(){return `<div class="adminbar"><div><span class="eye">Orders</span><h2>${data.orders.length?data.orders.length+' orders':'No orders yet'}</h2></div></div>${data.orders.length?`<div class="manage">${data.orders.map(o=>`<div class="row"><b>${E(o.id)}</b><span>${E(o.name)}</span><span>${money(o.total)}</span><span>WhatsApp Pending</span></div>`).join('')}</div>`:`<div class="empty-admin">No orders yet</div>`}`}
function v2themes(){return `<div class="adminbar"><div><span class="eye">Themes</span><h2>Nine theme moods</h2></div></div><div class="themegrid">${themes.map(x=>`<button class="theme ${data.settings.theme===x.id?'on':''}" onclick="data.settings.theme=${x.id};v2done('${E(x.name)}')"><div class="palette">${[x.p,x.a,x.bg,x.card,x.ink].map(c=>`<i style="background:${c}"></i>`).join('')}</div><h3>${E(x.name)}</h3></button>`).join('')}</div>`}
function v2settings(){return `<div class="adminbar"><div><span class="eye">Settings</span><h2>Website identity</h2></div></div><form class="adminform" onsubmit="v2saveSettings(event)"><h2>Website identity</h2><label>Website name<input name="name" value="${E(data.settings.name)}"></label><label>Logo URL<input name="logo" value="${E(data.settings.logo)}"></label><label class="full">Logo alternative text<input name="alt" value="${E(data.settings.logoAlt)}"></label><div class="brand-preview full">${data.settings.logo?`<img src="${E(data.settings.logo)}">`:`<b class="mono">◆</b>`}<div><small>Website identity</small><h3>${E(data.settings.name)}</h3></div></div><label>Currency<input name="currency" value="${E(data.settings.currency)}"></label><label>Main WhatsApp<input name="wa" value="${E(data.settings.mainWa)}"></label><label>Delivery fee<input type="number" name="delivery" value="${data.settings.delivery}"></label><label>Language<select name="language"><option value="en" ${v2lang==='en'?'selected':''}>English</option><option value="fr" ${v2lang==='fr'?'selected':''}>Français</option><option value="ar" ${v2lang==='ar'?'selected':''}>العربية</option></select></label><div class="formactions"><label class="btn">Upload logo<input hidden type="file" accept="image/*" onchange="v2uploadMedia(event,'logo')"></label><button type="button" class="btn danger" onclick="v2deleteMedia('logo')">Delete logo</button><button class="btn dark">Save identity</button></div></form>`}
function v2read(e,cb){let f=e.target.files?.[0];if(!f)return;if(f.size>3500000)return toast('Image must be below 3.5 MB');let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function v2target(key){let a=key.split('|');if(key==='hero')return{get:()=>data.settings.heroImage,set:v=>data.settings.heroImage=v};if(key==='logo')return{get:()=>data.settings.logo,set:v=>data.settings.logo=v};if(a[0]==='cover'){let s=S(a[1]);return{get:()=>s.cover,set:v=>s.cover=v}}if(a[0]==='storelogo'){let s=S(a[1]);return{get:()=>s.logo,set:v=>s.logo=v}}if(a[0]==='product'){let c=v2p(a[1]).colors[+a[2]],i=+a[3];return{get:()=>c.images[i],set:v=>c.images[i]=v,del:()=>c.images.length>1?c.images.splice(i,1):c.images[0]=V2PH}}}
function v2replaceMedia(k){let t=v2target(k),u=prompt('New image URL',t.get()||'');if(u){t.set(u);v2done('Picture replaced')}}function v2uploadMedia(e,k){v2read(e,u=>{v2target(k).set(u);v2done('Picture uploaded')})}function v2deleteMedia(k){if(!confirm('Delete this picture?'))return;let t=v2target(k);t.del?t.del():t.set(k==='hero'?V2PH:'');v2done('Picture deleted')}
function v2addImage(id,ci){let u=prompt('Image URL');if(u){v2p(id).colors[ci].images.push(u);v2done('Picture added')}}function v2replaceImage(id,ci,ii){let c=v2p(id).colors[ci],u=prompt('New image URL',c.images[ii]);if(u){c.images[ii]=u;v2done('Picture replaced')}}function v2uploadImage(e,id,ci,ii){v2read(e,u=>{let a=v2p(id).colors[ci].images;ii<0?a.push(u):a[ii]=u;v2done('Picture uploaded')})}function v2deleteImage(id,ci,ii){if(confirm('Delete this picture?')){let a=v2p(id).colors[ci].images;a.length>1?a.splice(ii,1):a[0]=V2PH;v2done('Picture deleted')}}
function v2addStore(){let n=prompt('Store name');if(!n)return;let id='s'+Date.now();data.stores.push({id,slug:n.toLowerCase().replace(/\W+/g,'-'),name:n,mono:n.slice(0,2).toUpperCase(),cat:prompt('Category','Fashion')||'Fashion',city:prompt('City','Morocco')||'Morocco',rating:5,desc:prompt('Description','New store')||'',cover:'/assets/hero.webp',logo:'',phone:'',wa:data.settings.mainWa,email:'',address:'',hours:'Mon–Sat'});ui.openStore=id;v2done('Store added')}
function v2editStore(id){let s=S(id),n=prompt('Store name',s.name);if(n===null)return;s.name=n||s.name;s.cat=prompt('Category',s.cat)||s.cat;s.city=prompt('City',s.city)||s.city;s.desc=prompt('Description',s.desc)||s.desc;s.wa=prompt('WhatsApp',s.wa)||s.wa;v2done('Store updated')}function v2deleteStore(id){if(confirm('Delete store and its products?')){data.stores=data.stores.filter(s=>s.id!==id);data.products=data.products.filter(p=>p.store!==id);ui.openStore=data.stores[0]?.id;v2done('Store deleted')}}
function v2addProduct(sid){let n=prompt('Product name');if(!n)return;let id='p'+Date.now();data.products.push({id,slug:n.toLowerCase().replace(/\W+/g,'-'),store:sid,name:n,cat:prompt('Category','Fashion')||'Fashion',desc:prompt('Description','New product')||'',base:+(prompt('Price','500')||500),featured:true,new:true,colors:[{name:'Default',hex:'#333',images:['/assets/blazer-black.webp'],sizes:[{n:'One size',sku:'SKU-'+Date.now(),stock:1}]}]});ui.openProduct=id;v2done('Product added')}function v2editProduct(id){let p=v2p(id),n=prompt('Product name',p.name);if(n===null)return;p.name=n||p.name;p.cat=prompt('Category',p.cat)||p.cat;p.desc=prompt('Description',p.desc)||p.desc;p.base=+(prompt('Price',p.base)||p.base);v2done('Product updated')}function v2deleteProduct(id){if(confirm('Delete this product?')){data.products=data.products.filter(p=>p.id!==id);ui.openProduct='';v2done('Product deleted')}}
function v2addColor(id){let p=v2p(id),n=prompt('Color name','New color');if(n){p.colors.push({name:n,hex:prompt('Hex color','#777')||'#777',images:[V2PH],sizes:[{n:'One size',sku:'SKU-'+Date.now(),stock:1}]});v2done('Color added')}}function v2editColor(id,ci){let c=v2p(id).colors[ci];c.name=prompt('Color name',c.name)||c.name;c.hex=prompt('Hex color',c.hex)||c.hex;v2done('Color updated')}function v2deleteColor(id,ci){let p=v2p(id);if(p.colors.length>1&&confirm('Delete this color?')){p.colors.splice(ci,1);v2done('Color deleted')}}
function v2addVariant(id,ci){let c=v2p(id).colors[ci],n=prompt('Size / variant','M');if(n){c.sizes.push({n,sku:prompt('SKU','SKU-'+Date.now()),stock:+(prompt('Stock','1')||0),price:+(prompt('Price override','0')||0)||undefined});v2done('Variant added')}}function v2editVariant(id,ci,vi){let v=v2p(id).colors[ci].sizes[vi];v.n=prompt('Size / variant',v.n||v.name)||v.n;v.sku=prompt('SKU',v.sku)||v.sku;v.stock=+(prompt('Stock',v.stock)||0);let p=+(prompt('Price override',v.price||0)||0);p?v.price=p:delete v.price;v2done('Variant updated')}function v2deleteVariant(id,ci,vi){let a=v2p(id).colors[ci].sizes;if(a.length>1&&confirm('Delete variant?')){a.splice(vi,1);v2done('Variant deleted')}}
function v2saveHome(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{notice:f.notice,heroTitle:f.title,heroText:f.text,heroImage:f.hero||V2PH});v2done('Homepage saved')}function v2saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{name:f.name||data.settings.name,logo:f.logo||'',logoAlt:f.alt||f.name,currency:f.currency,mainWa:(f.wa||'').replace(/\D/g,''),delivery:+f.delivery});v2lang=f.language;localStorage.setItem('vetra-language',v2lang);v2done('Settings saved')}
const v2oldHome=home;home=function(){let h=v2oldHome();return data.settings.heroImage&&data.settings.heroImage!=='/assets/hero.webp'?h.replace('src="/assets/hero.webp"','src="'+E(data.settings.heroImage)+'"'):h};
render();

</script><script id="vetra-v3-app">
/* VETRA v3: homepage blocks, structured translations and raw-event analytics */
const V3_VERSION='3.0.0';
const V3_DEFAULT_BLOCKS=[
 {id:'stores',type:'stores',enabled:true,eye:'THE STORE DIRECTORY',title:'Distinct points of view',text:'Meet independent names shaping a more personal way to shop.',link:'/stores'},
 {id:'featured',type:'featured',enabled:true,eye:'THE WEEKLY EDIT',title:'New, noteworthy, now',text:'A small selection worth knowing.',link:'/stores'},
 {id:'editorial',type:'editorial',enabled:true,eye:'OBJECTS OF DESIRE',title:'Details do the talking.',text:'Soft leather, sculptural metal and silk with a story.',image:'/assets/accessories.webp',button:'Shop Sienna Objects →',link:'/store/sienna-objects'},
 {id:'trending',type:'trending',enabled:true,eye:'MOST WANTED',title:'The pieces moving fastest',text:''},
 {id:'newsletter',type:'newsletter',enabled:true,eye:'THE VETRA LETTER',title:'Considered style, delivered lightly.',text:'New stores and thoughtful edits. No noise.'}
];
data.analyticsEvents=Array.isArray(data.analyticsEvents)?data.analyticsEvents:[];
data.homeBlocks=Array.isArray(data.homeBlocks)&&data.homeBlocks.length?data.homeBlocks:structuredClone(V3_DEFAULT_BLOCKS);
data.categories=Array.isArray(data.categories)&&data.categories.length?data.categories:[
 {id:'women',name:'Women',image:'/assets/store-one.webp'},
 {id:'men',name:'Men',image:'/assets/store-two.webp'},
 {id:'accessories',name:'Accessories',image:'/assets/accessories.webp'}
];
data.settings.seoTitle??=`${data.settings.name} — Fashion Marketplace`;
data.settings.seoDescription??='Independent fashion stores, products and WhatsApp ordering in one marketplace.';
ui.analyticsSort??='leads';ui.pendingLogo??='';
const v3SessionId=sessionStorage.getItem('vetra-analytics-session')||((crypto.randomUUID?.()||'s-'+Date.now()+'-'+Math.random().toString(16).slice(2)));
sessionStorage.setItem('vetra-analytics-session',v3SessionId);
let v3LastProductPath='';
function v3Path(){return window.VETRA_QA_ROUTE||location.pathname}
function v3ProductStats(){const map={};data.products.forEach(p=>map[p.id]={product:p,views:0,leads:0});for(const e of data.analyticsEvents){if(!map[e.productId])continue;if(e.type==='view')map[e.productId].views++;if(e.type==='lead')map[e.productId].leads++}return map}
function v3StoreStats(){const products=v3ProductStats(),map={};data.stores.forEach(s=>map[s.id]={store:s,views:0,leads:0,products:0});for(const x of Object.values(products)){const row=map[x.product.store];if(row){row.views+=x.views;row.leads+=x.leads;row.products++}}return map}
function v3Record(type,p){if(!p||!['view','lead'].includes(type))return;const event={id:crypto.randomUUID?.()||'e-'+Date.now()+'-'+Math.random().toString(16).slice(2),timestamp:new Date().toISOString(),productId:p.id,storeId:p.store,type,sessionId:v3SessionId,path:v3Path()};data.analyticsEvents.push(event);if(data.analyticsEvents.length>10000)data.analyticsEvents.splice(0,data.analyticsEvents.length-10000);save();if(location.protocol.startsWith('http'))fetch('/api/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)}).catch(()=>{});return event}
function v3TrackCurrentView(){const path=v3Path();if(path.startsWith('/product/')){if(path!==v3LastProductPath){const p=P(decodeURIComponent(path.split('/')[2]||''));if(p)v3Record('view',p);v3LastProductPath=path}}else v3LastProductPath=''}
const v3BaseBuyNow=buyNow;
buyNow=function(slug){const p=P(slug),c=p?.colors?.[ui.color],variant=c?.sizes?.find(x=>x.n===ui.size);if(p&&variant)v3Record('lead',p);return v3BaseBuyNow(slug)};
function v3ApplyMeta(){document.title=data.settings.seoTitle||`${data.settings.name} — Fashion Marketplace`;let m=document.querySelector('meta[name="description"]');if(m)m.content=data.settings.seoDescription||'';document.body.dataset.vetraVersion=V3_VERSION}
const v3BaseRender=render;
render=function(){v3BaseRender();v3ApplyMeta();v3TrackCurrentView()};
addEventListener('popstate',()=>setTimeout(()=>{v3ApplyMeta();v3TrackCurrentView()},0));

async function v3LoadLanguage(lang){if(lang==='en')return;try{const r=await fetch(`/i18n/${lang}.json?v=${V3_VERSION}`,{cache:'no-store'});if(!r.ok)return;const values=await r.json();Object.assign(lang==='fr'?FR:AR,values)}catch{}}
const v3BaseSetLanguage=v2setLang;
v2setLang=async function(lang){await v3LoadLanguage(lang);v3BaseSetLanguage(lang)};
if(v2lang!=='en')v3LoadLanguage(v2lang).then(()=>render());

function v3HomeBlock(b){if(b.enabled===false)return'';if(b.type==='stores')return `<section class="section wrap">${heading(E(b.eye),E(b.title),E(b.text),b.link||'/stores')}<div class="store-grid">${data.stores.map(storeCard).join('')}</div></section>`;if(b.type==='featured'){let ps=data.products.filter(p=>p.featured);if(!ps.length)ps=data.products.slice(0,4);return `<section class="section alt" id="new"><div class="wrap">${heading(E(b.eye),E(b.title),E(b.text),b.link||'/stores')}<div class="product-grid">${ps.slice(0,8).map(productCard).join('')}</div></div></section>`}if(b.type==='editorial'||b.type==='custom')return `<section class="${b.type==='custom'?'custom-home-block':'editorial'} wrap">${b.image?`<img src="${E(b.image)}" alt="${E(b.title)}">`:''}<div class="${b.type==='custom'?'custom-home-copy':'editorial-copy'}"><span class="eye">${E(b.eye||'FEATURED')}</span><h2>${E(b.title)}</h2><p>${E(b.text||'')}</p>${b.button?`<a data-go class="btn dark" href="${E(b.link||'/stores')}">${E(b.button)}</a>`:''}</div></section>`;if(b.type==='trending'){let stats=v3ProductStats(),ps=[...data.products].sort((a,z)=>(stats[z.id]?.views||0)-(stats[a.id]?.views||0));return `<section class="section wrap">${heading(E(b.eye),E(b.title),E(b.text||''))}<div class="product-grid">${ps.slice(0,4).map(productCard).join('')}</div></section>`}if(b.type==='newsletter')return `<section class="newsletter wrap"><div><span class="eye">${E(b.eye)}</span><h2>${E(b.title)}</h2><p>${E(b.text||'')}</p></div></section>`;return''}
home=function(){return `${header()}<main><section class="hero"><img src="${E(data.settings.heroImage||'/assets/hero.webp')}" alt=""><div class="hero-copy wrap"><span class="eye">THE NEW MOROCCAN MARKETPLACE</span><h1>${E(data.settings.heroTitle)}</h1><p>${E(data.settings.heroText)}</p><div class="buttons"><a data-go class="btn dark" href="/stores">Explore stores →</a><a class="btn glass" href="#new">Shop the new edit</a></div></div></section><div class="cats wrap">${data.categories.map(c=>`<button onclick="go('/stores')">${E(c.name)}</button>`).join('')}<button onclick="go('/stores')">New arrivals</button><button onclick="go('/stores')">Sale</button></div>${data.homeBlocks.map(v3HomeBlock).join('')}</main>${footer()}`};

const v3BaseAdmin=admin,v3BaseAdminContent=adminContent;
admin=function(){if(sessionStorage.getItem('admin')!=='1')return v3BaseAdmin();const t=ui.tab||'overview',tabs=[['overview','Overview'],['catalog','Catalog'],['media','Media'],['homepage','Homepage'],['analytics','Analytics'],['orders','Orders'],['themes','Themes'],['settings','Settings']];return `<main class="admin"><aside class="sidebar"><a data-go href="/" class="logo">${E(data.settings.name)} ◆</a>${tabs.map(x=>`<button class="${t===x[0]?'on':''}" onclick="ui.tab='${x[0]}';ui.openProduct='';render()">${x[1]}</button>`).join('')}<button onclick="sessionStorage.clear();go('/0')">Sign out</button></aside><section class="adminmain"><header class="adminhead"><div><span class="eye">MARKETPLACE ADMIN</span><h1>${tabs.find(x=>x[0]===t)?.[1]}</h1></div><b>Admin · v${V3_VERSION}</b></header><div class="admincontent">${adminContent(t)}</div></section></main>`};
adminContent=function(t){if(t==='analytics')return v3Analytics();return v3BaseAdminContent(t)};
v2overview=function(){const ps=v3ProductStats(),views=Object.values(ps).reduce((n,x)=>n+x.views,0),leads=Object.values(ps).reduce((n,x)=>n+x.leads,0);return `<div class="adminbar"><div><span class="eye">Overview</span><h2>Everything at a glance.</h2></div><div class="admin-actions"><button class="btn" onclick="ui.tab='analytics';render()">Analytics →</button><button class="btn dark" onclick="ui.tab='catalog';render()">Catalog →</button></div></div><div class="stats"><div class="stat"><small>Stores</small><strong>${data.stores.length}</strong></div><div class="stat"><small>Products</small><strong>${data.products.length}</strong></div><div class="stat"><small>Views</small><strong>${views}</strong></div><div class="stat"><small>Leads</small><strong>${leads}</strong></div><div class="stat"><small>Pictures</small><strong>${v2mediaEntries().length}</strong></div><div class="stat"><small>Variants</small><strong>${data.products.reduce((n,p)=>n+v2variants(p),0)}</strong></div></div><div class="hint"><b>Catalog hierarchy</b> · Store → Products → Product information → Pictures + Variants</div>`};
function v3Analytics(){const products=Object.values(v3ProductStats()),stores=Object.values(v3StoreStats()),views=products.reduce((n,x)=>n+x.views,0),leads=products.reduce((n,x)=>n+x.leads,0),conversion=views?((leads/views)*100).toFixed(1):'0.0',sort=ui.analyticsSort||'leads';products.sort((a,b)=>sort==='name'?a.product.name.localeCompare(b.product.name):(b[sort]||0)-(a[sort]||0));stores.sort((a,b)=>(b[sort]||0)-(a[sort]||0));const latest=[...data.analyticsEvents].reverse().slice(0,50);return `<div class="adminbar"><div><span class="eye">Raw-event analytics</span><h2>Views & leads</h2></div><div class="admin-actions"><button class="btn" onclick="v3SyncCloud()">Sync cloud</button><button class="btn" onclick="v3ExportEvents()">Export CSV</button><button class="btn danger" onclick="v3ClearLocalEvents()">Clear local events</button></div></div><div class="cloud-note">Local preview events are stored in this browser. Configure Supabase and the included Vercel function for shared production analytics across all visitors.</div><div class="analytics-kpis"><div class="analytics-kpi"><small>Product views</small><strong>${views}</strong><em>Raw page-open events</em></div><div class="analytics-kpi"><small>WhatsApp leads</small><strong>${leads}</strong><em>Product WhatsApp clicks</em></div><div class="analytics-kpi"><small>Lead rate</small><strong>${conversion}%</strong><em>Leads ÷ views</em></div><div class="analytics-kpi"><small>Raw events</small><strong>${data.analyticsEvents.length}</strong><em>Timestamped records</em></div></div><div class="analytics-grid"><section class="analytics-panel"><div class="analytics-panel-head"><h3>Store performance</h3><span>${stores.length} stores</span></div><div class="analytics-table-wrap"><table class="analytics-table"><thead><tr><th>Store</th><th>Products</th><th>Views</th><th>Leads</th><th>Rate</th></tr></thead><tbody>${stores.map(x=>`<tr><td><button onclick="ui.tab='catalog';ui.openStore='${x.store.id}';render()">${E(x.store.name)}</button></td><td>${x.products}</td><td class="metric-number">${x.views}</td><td class="metric-number">${x.leads}</td><td class="conversion">${x.views?((x.leads/x.views)*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div></section><section class="analytics-panel"><div class="analytics-panel-head"><h3>Product performance</h3><select onchange="ui.analyticsSort=this.value;render()"><option value="leads" ${sort==='leads'?'selected':''}>Sort: leads</option><option value="views" ${sort==='views'?'selected':''}>Sort: views</option><option value="name" ${sort==='name'?'selected':''}>Sort: name</option></select></div><div class="analytics-table-wrap"><table class="analytics-table"><thead><tr><th>Product</th><th>Store</th><th>Views</th><th>Leads</th><th>Rate</th></tr></thead><tbody>${products.map(x=>`<tr><td><button onclick="v3OpenProduct('${x.product.id}')">${E(x.product.name)}</button></td><td>${E(S(x.product.store)?.name||'')}</td><td class="metric-number">${x.views}</td><td class="metric-number">${x.leads}</td><td class="conversion">${x.views?((x.leads/x.views)*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div></section></div><details class="event-log"><summary>Raw event log · latest ${latest.length}</summary><div class="event-list">${latest.length?latest.map(e=>`<div class="event-row"><span>${new Date(e.timestamp).toLocaleString()}</span><span class="event-kind ${e.type}">${e.type}</span><span>${E(v2p(e.productId)?.name||e.productId)}</span><span>${E(S(e.storeId)?.name||e.storeId)}</span></div>`).join(''):`<div class="empty-admin">No analytics events yet.</div>`}</div></details>`}
function v3OpenProduct(id){const p=v2p(id);if(!p)return;ui.tab='catalog';ui.openStore=p.store;ui.openProduct=id;render()}
async function v3SyncCloud(){let key=sessionStorage.getItem('vetra-analytics-admin-key')||prompt('Analytics admin key');if(!key)return;sessionStorage.setItem('vetra-analytics-admin-key',key);try{const r=await fetch('/api/analytics',{headers:{'X-Analytics-Admin-Key':key}}),j=await r.json();if(!r.ok)throw Error(j.error||'Sync failed');const map=new Map(data.analyticsEvents.map(e=>[e.id,e]));for(const e of j.events||[])map.set(e.id,e);data.analyticsEvents=[...map.values()].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));save();render();toast(`Synced ${j.events?.length||0} cloud events`)}catch(e){toast(e.message)}}
function v3ExportEvents(){const rows=[['id','timestamp','type','productId','storeId','sessionId','path'],...data.analyticsEvents.map(e=>[e.id,e.timestamp,e.type,e.productId,e.storeId,e.sessionId,e.path])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='vetra-analytics-events.csv';a.click();URL.revokeObjectURL(a.href)}
function v3ClearLocalEvents(){if(confirm('Clear analytics events stored in this browser? Cloud events are not deleted.')){data.analyticsEvents=[];save();render()}}

const v3BaseMediaEntries=v2mediaEntries,v3BaseTarget=v2target;
v2mediaEntries=function(){return [...v3BaseMediaEntries(),...data.categories.map(c=>({key:`category|${c.id}`,url:v2img(c.image),label:c.name,group:'Category image'}))]};
v2target=function(key){const a=key.split('|');if(a[0]==='category'){const c=data.categories.find(x=>x.id===a[1]);return{get:()=>c.image,set:v=>c.image=v}}return v3BaseTarget(key)};
v2media=function(){const entries=v2mediaEntries();return `<div class="adminbar"><div><span class="eye">Media & products</span><h2>Website media manager</h2></div><div class="admin-actions"><button class="btn" onclick="ui.tab='homepage';render()">Homepage editor</button><button class="btn dark" onclick="ui.tab='catalog';render()">Full catalog</button></div></div><section class="quick-products"><div class="quick-products-head"><div><span class="eye">Products</span><h3>Create, edit or delete</h3></div><div class="quick-add"><select id="quickStore">${data.stores.map(s=>`<option value="${s.id}">${E(s.name)}</option>`).join('')}</select><button class="btn dark" onclick="v3QuickAddProduct()">+ Add product</button></div></div><div class="quick-product-grid">${data.products.map(p=>`<article class="quick-product"><img src="${E(v2img(p.colors[0]?.images[0]))}" alt=""><div><strong>${E(p.name)}</strong><small>${E(S(p.store)?.name||'')} · ${money(p.sale||p.base)}</small><div class="quick-product-actions"><button onclick="v2editProduct('${p.id}')">Edit</button><button class="danger" onclick="v2deleteProduct('${p.id}')">Delete</button></div></div></article>`).join('')}</div></section><div class="media-tools"><input class="input" placeholder="Search pictures" oninput="v2filterMedia(this.value)"><span>${entries.length} pictures</span></div><div class="media-grid-admin">${entries.map(v2mediaCard).join('')}</div>`};
function v3QuickAddProduct(){const sid=document.querySelector('#quickStore')?.value||data.stores[0]?.id;if(sid)v2addProduct(sid)}

function v3TotalStock(p){return p.colors.reduce((n,c)=>n+c.sizes.reduce((a,v)=>a+Number(v.stock||0),0),0)}
v2productDetail=function(p){const m=v3ProductStats()[p.id]||{views:0,leads:0};return `<div class="product-detail-admin"><div class="adminbar"><div><span class="eye">Product detail</span><h3>${E(p.name)}</h3><div class="product-detail-tabs"><span>Information</span><span>Pictures</span><span>Variants</span></div></div><div class="admin-actions"><button class="btn" onclick="v2editProduct('${p.id}')">Edit information</button><button class="btn dark" onclick="v2addColor('${p.id}')">+ Add color</button></div></div><div class="info-grid"><div class="info-tile"><small>Store</small><strong>${E(S(p.store)?.name||'')}</strong></div><div class="info-tile"><small>Price</small><strong>${money(p.sale||p.base)}</strong></div><div class="info-tile"><small>Total stock</small><strong>${v3TotalStock(p)}</strong></div><div class="info-tile"><small>Views</small><strong>${m.views}</strong></div><div class="info-tile"><small>Leads</small><strong>${m.leads}</strong></div><div class="info-tile"><small>Category</small><strong>${E(p.cat)}</strong></div><div class="info-tile info-wide"><small>Description</small><strong>${E(p.desc)}</strong></div></div><div class="colors-admin">${p.colors.map((c,ci)=>v2colorPanel(p,c,ci)).join('')}</div></div>`};
v2picture=function(pid,ci,ii,u){return `<article class="picture-card"><img src="${E(v2img(u))}" alt=""><div class="picture-copy"><small>${E(u.split('/').pop()||'Image')}</small><div class="picture-actions v3"><button onclick="v3MoveImage('${pid}',${ci},${ii},-1)" aria-label="Move left">←</button><button onclick="v3MoveImage('${pid}',${ci},${ii},1)" aria-label="Move right">→</button><button onclick="v2replaceImage('${pid}',${ci},${ii})">Replace</button><label>Upload<input type="file" accept="image/*" onchange="v2uploadImage(event,'${pid}',${ci},${ii})"></label><button class="danger" onclick="v2deleteImage('${pid}',${ci},${ii})">Delete</button></div></div></article>`};
function v3MoveImage(pid,ci,ii,delta){const a=v2p(pid).colors[ci].images,to=ii+delta;if(to<0||to>=a.length)return;[a[ii],a[to]]=[a[to],a[ii]];v2done('Picture order updated')}

v2homepage=function(){return `<div class="adminbar"><div><span class="eye">Homepage</span><h2>Homepage editor</h2></div><div class="admin-actions"><button class="btn dark" onclick="v3AddBlock()">+ Add layout block</button></div></div><div class="home-editor"><form class="adminform" onsubmit="v3SaveHome(event)"><h2>Main page hero</h2><label class="full">Announcement<input name="notice" value="${E(data.settings.notice)}"></label><label class="full">Hero headline<textarea name="title">${E(data.settings.heroTitle)}</textarea></label><label class="full">Hero introduction<textarea name="text">${E(data.settings.heroText)}</textarea></label><label class="full">Hero image URL<input name="hero" value="${E(data.settings.heroImage)}"></label><div class="formactions"><label class="btn">Upload<input hidden type="file" accept="image/*" onchange="v2uploadMedia(event,'hero')"></label><button type="button" class="btn danger" onclick="v2deleteMedia('hero')">Delete</button><button class="btn dark">Save homepage</button></div></form><aside class="home-preview"><img src="${E(v2img(data.settings.heroImage))}" alt=""><div><span class="eye">Main page</span><h3>${E(data.settings.heroTitle)}</h3><p>${E(data.settings.heroText)}</p></div></aside></div><section class="homepage-blocks"><div class="homepage-blocks-head"><div><span class="eye">Layout blocks</span><h3>Featured content & sections</h3></div><button class="btn dark" onclick="v3AddBlock()">+ Add block</button></div>${data.homeBlocks.map((b,i)=>`<div class="block-row"><div class="block-order"><button onclick="v3MoveBlock('${b.id}',-1)" aria-label="Move up">↑</button><button onclick="v3MoveBlock('${b.id}',1)" aria-label="Move down">↓</button></div><div class="block-copy"><span class="layout-badge">${E(b.type)}</span><strong>${E(b.title)}</strong><small>${E(b.text||'')}</small></div><div class="block-actions"><button class="${b.enabled===false?'inactive':'active'}" onclick="v3ToggleBlock('${b.id}')">${b.enabled===false?'Disabled':'Enabled'}</button><button onclick="v3EditBlock('${b.id}')">Edit</button><button class="danger" onclick="v3DeleteBlock('${b.id}')">Delete</button></div></div>`).join('')}</section><section class="featured-manager"><span class="eye">Featured products</span><h3>Choose products for the homepage edit</h3><div class="featured-list">${data.products.map(p=>`<label class="featured-item"><img src="${E(v2img(p.colors[0]?.images[0]))}" alt=""><span>${E(p.name)}</span><input type="checkbox" ${p.featured?'checked':''} onchange="v3ToggleFeatured('${p.id}',this.checked)"></label>`).join('')}</div></section>`};
function v3SaveHome(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{notice:f.notice,heroTitle:f.title,heroText:f.text,heroImage:f.hero||V2PH});v2done('Homepage saved')}
function v3AddBlock(){const type=(prompt('Block type: custom, featured, stores, editorial, trending, newsletter','custom')||'').toLowerCase();if(!['custom','featured','stores','editorial','trending','newsletter'].includes(type))return toast('Unknown block type');const id='block-'+Date.now(),title=prompt('Block title','New featured block');if(!title)return;data.homeBlocks.push({id,type,enabled:true,eye:prompt('Eyebrow label','FEATURED')||'',title,text:prompt('Description','')||'',image:type==='custom'||type==='editorial'?prompt('Image URL','/assets/accessories.webp')||'':'',button:prompt('Button label (optional)','Explore →')||'',link:prompt('Button link','/stores')||'/stores'});v2done('Homepage block added')}
function v3EditBlock(id){const b=data.homeBlocks.find(x=>x.id===id);if(!b)return;b.eye=prompt('Eyebrow label',b.eye)||b.eye;b.title=prompt('Title',b.title)||b.title;b.text=prompt('Description',b.text||'')??b.text;if(['custom','editorial'].includes(b.type))b.image=prompt('Image URL',b.image||'')??b.image;b.button=prompt('Button label',b.button||'')??b.button;b.link=prompt('Button link',b.link||'/stores')??b.link;v2done('Homepage block updated')}
function v3ToggleBlock(id){const b=data.homeBlocks.find(x=>x.id===id);if(b){b.enabled=b.enabled===false;v2done(b.enabled?'Block enabled':'Block disabled')}}
function v3MoveBlock(id,delta){const i=data.homeBlocks.findIndex(x=>x.id===id),to=i+delta;if(i<0||to<0||to>=data.homeBlocks.length)return;[data.homeBlocks[i],data.homeBlocks[to]]=[data.homeBlocks[to],data.homeBlocks[i]];v2done('Block order updated')}
function v3DeleteBlock(id){if(confirm('Delete this homepage block?')){data.homeBlocks=data.homeBlocks.filter(x=>x.id!==id);v2done('Homepage block deleted')}}
function v3ToggleFeatured(id,checked){const p=v2p(id);if(p){p.featured=checked;save();toast('Featured products updated')}}

v2settings=function(){const logo=ui.pendingLogo||data.settings.logo||'';return `<div class="adminbar"><div><span class="eye">Settings</span><h2>Website identity</h2></div></div><form class="adminform" onsubmit="v3SaveSettings(event)"><h2>Website name & logo</h2><label>Website name<input name="name" value="${E(data.settings.name)}" oninput="document.querySelector('#identityName').textContent=this.value"></label><label>Logo URL<input name="logo" value="${E(data.settings.logo)}" oninput="v3PreviewLogoUrl(this.value)"></label><label class="full">Logo alternative text<input name="alt" value="${E(data.settings.logoAlt)}"></label><div class="logo-preview-live full"><div id="logoPreview">${logo?`<img src="${E(logo)}" alt="Logo preview">`:`<span class="fallback-logo">◆</span>`}</div><div><small>Preview before saving</small><h3 id="identityName">${E(data.settings.name)}</h3></div></div><label>Currency<input name="currency" value="${E(data.settings.currency)}"></label><label>Main WhatsApp<input name="wa" value="${E(data.settings.mainWa)}"></label><label>Delivery fee<input type="number" name="delivery" value="${data.settings.delivery}"></label><label>Language<select name="language"><option value="en" ${v2lang==='en'?'selected':''}>English</option><option value="fr" ${v2lang==='fr'?'selected':''}>Français</option><option value="ar" ${v2lang==='ar'?'selected':''}>العربية</option></select></label><label class="full">SEO / browser title<input name="seoTitle" value="${E(data.settings.seoTitle)}"></label><label class="full">SEO description<textarea name="seoDescription">${E(data.settings.seoDescription)}</textarea></label><div class="formactions"><label class="btn">Choose logo<input hidden type="file" accept="image/*" onchange="v3PreviewLogoFile(event)"></label><button type="button" class="btn danger" onclick="ui.pendingLogo='';v3PreviewLogoUrl('')">Remove preview</button><button class="btn dark">Save identity</button></div></form>`};
function v3PreviewLogoUrl(url){ui.pendingLogo=url;const box=document.querySelector('#logoPreview');if(box)box.innerHTML=url?`<img src="${E(url)}" alt="Logo preview">`:'<span class="fallback-logo">◆</span>'}
function v3PreviewLogoFile(e){const f=e.target.files?.[0];if(!f)return;if(f.size>3500000)return toast('Logo must be below 3.5 MB');const r=new FileReader();r.onload=()=>v3PreviewLogoUrl(r.result);r.readAsDataURL(f)}
function v3SaveSettings(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),logo=ui.pendingLogo||f.logo||'';Object.assign(data.settings,{name:f.name||data.settings.name,logo,logoAlt:f.alt||f.name,currency:f.currency,mainWa:(f.wa||'').replace(/\D/g,''),delivery:Number(f.delivery||0),seoTitle:f.seoTitle||`${f.name} — Fashion Marketplace`,seoDescription:f.seoDescription||''});ui.pendingLogo='';save();v2setLang(f.language||v2lang);toast('Website identity saved')}

render();

</script><script id="vetra-v4-app">
/* VETRA v4 — requested admin order, market/product editors and upload-first media */
const V4_VERSION='4.0.0';
const V4_NOW=Date.now();
data.stores.forEach((s,i)=>{s.hidden??=false;s.createdAt??=new Date(V4_NOW-(i+10)*86400000).toISOString();s.logo??=s.cover;s.instagram??='';s.facebook??='';s.website??=''});
data.products.forEach((p,i)=>{p.hidden??=false;p.createdAt??=new Date(V4_NOW-(i+6)*86400000).toISOString();if(!Array.isArray(p.media)||!p.media.length){let urls=[...new Set(p.colors.flatMap(c=>c.images||[]))].slice(0,10);p.media=urls.map((url,n)=>({id:`${p.id}-media-${n}`,type:'image',url,name:url.split('/').pop()||`Image ${n+1}`}))}});
data.orders.forEach((o,i)=>{o.createdAt??=new Date(V4_NOW-(i+1)*86400000).toISOString();o.storeId??=data.stores[i%Math.max(1,data.stores.length)]?.id;o.products??=[];o.whatsappMessage??=`Order ${o.id} from ${o.name||'customer'} — total ${money(o.total||0)}`});
if(['overview','catalog','media'].includes(ui.tab))ui.tab='dashboard';
ui.marketId??='';ui.productMarketId??=data.stores[0]?.id||'';ui.productId??='';ui.orderSort??='date';
function v4SafeSave(){try{if(JSON.stringify(data).length>4500000)throw Error('Browser storage is full. Use smaller files or cloud storage.');save();return true}catch(e){toast(e.message||'Unable to save media');return false}}
function v4Date(x){try{return new Date(x).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}catch{return'—'}}
function v4Slug(x){return String(x||'item').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item'}
function v4MediaOf(p){return Array.isArray(p.media)?p.media:[]}
function v4FirstImage(p){return v4MediaOf(p).find(m=>m.type==='image')?.url||p.colors?.[0]?.images?.[0]||V2PH}
function v4SyncProductImages(p){let imgs=v4MediaOf(p).filter(m=>m.type==='image').map(m=>m.url);if(!p.colors?.length)p.colors=[{name:'Default',hex:'#222',images:imgs.length?imgs:[V2PH],sizes:[sz('One size','SKU-'+Date.now(),1)]}];else if(imgs.length)p.colors[0].images=imgs}
function v4ActiveStores(){return data.stores.filter(s=>!s.hidden)}
function v4ActiveProducts(storeId){return data.products.filter(p=>!p.hidden&&(!storeId||p.store===storeId)&&!S(p.store)?.hidden)}

const v4PreviousAdmin=admin,v4PreviousContent=adminContent;
admin=function(){if(sessionStorage.getItem('admin')!=='1')return v4PreviousAdmin();const t=ui.tab||'dashboard',tabs=[['dashboard','Dashboard'],['orders','Orders'],['markets','Markets'],['products','Products'],['homepage','Homepage'],['analytics','Analytics'],['themes','Themes'],['settings','Settings']];return `<main class="admin"><aside class="sidebar"><a data-go href="/" class="logo">${E(data.settings.name)} ◆</a>${tabs.map(x=>`<button class="${t===x[0]?'on':''}" onclick="ui.tab='${x[0]}';render()">${x[1]}</button>`).join('')}<button onclick="sessionStorage.clear();go('/0')">Sign out</button></aside><section class="adminmain"><header class="adminhead"><div><span class="eye">MARKETPLACE ADMIN</span><h1>${tabs.find(x=>x[0]===t)?.[1]||'Dashboard'}</h1></div><b>Admin · v${V4_VERSION}</b></header><div class="admincontent">${adminContent(t)}</div></section></main>`};
adminContent=function(t){if(t==='dashboard')return v4Dashboard();if(t==='orders')return v4Orders();if(t==='markets')return v4Markets();if(t==='products')return v4Products();if(t==='homepage')return v4Homepage();if(t==='analytics')return v3Analytics();return v4PreviousContent(t)};
function v4Dashboard(){const week=V4_NOW-7*86400000,visitors=new Set(data.analyticsEvents.filter(e=>e.type==='view'&&new Date(e.timestamp).getTime()>=week).map(e=>e.sessionId)).size,newOrders=data.orders.filter(o=>new Date(o.createdAt).getTime()>=week).length;return `<div class="adminbar"><div><span class="eye">Dashboard</span><h2>Your marketplace today.</h2></div><div class="v4-actions"><button onclick="ui.tab='markets';render()">Manage markets</button><button class="dark" onclick="ui.tab='products';render()">Manage products</button></div></div><div class="v4-kpis"><div class="v4-kpi"><small>Markets</small><strong>${data.stores.length}</strong><span>All created markets</span></div><div class="v4-kpi"><small>Active markets</small><strong>${v4ActiveStores().length}</strong><span>Visible on the storefront</span></div><div class="v4-kpi"><small>New visitors</small><strong>${visitors}</strong><span>Unique sessions · last 7 days</span></div><div class="v4-kpi"><small>New orders</small><strong>${newOrders}</strong><span>WhatsApp orders · last 7 days</span></div></div><section class="v4-section"><div class="v4-section-head"><div><span class="eye">Latest activity</span><h3>Recent orders</h3></div><button class="btn" onclick="ui.tab='orders';render()">View all orders →</button></div><div class="v4-orders" style="padding:14px">${data.orders.slice(0,4).map(v4OrderCard).join('')||'<div class="empty-admin">No orders yet.</div>'}</div></section>`}

const v4OriginalSendOrder=sendOrder;
sendOrder=function(id){const rs=cartRows().filter(x=>x.s.id===id),f={...ui.form};v4OriginalSendOrder(id);const o=data.orders[0];if(o){o.createdAt=new Date().toISOString();o.storeId=id;o.products=rs.map(x=>({id:x.p.id,name:x.p.name,qty:x.i.qty,sku:x.v.sku}));o.customerPhone=f.phone||'';o.city=f.city||'';o.whatsappMessage=`NEW ORDER ${o.id}\nCustomer: ${f.name||''}\nPhone: ${f.phone||''}\nCity: ${f.city||''}\n${o.products.map(x=>`${x.qty} × ${x.name} (${x.sku})`).join('\n')}\nTotal: ${money(o.total||0)}`;save()}};
function v4OrderRows(){let rows=[...data.orders],k=ui.orderSort||'date';rows.sort((a,b)=>k==='market'?(S(a.storeId)?.name||'').localeCompare(S(b.storeId)?.name||''):k==='product'?(a.products?.[0]?.name||'').localeCompare(b.products?.[0]?.name||''):new Date(b.createdAt)-new Date(a.createdAt));return rows}
function v4Orders(){let rows=v4OrderRows();return `<div class="adminbar"><div><span class="eye">WhatsApp orders</span><h2>All orders</h2></div><div class="v4-order-tools"><select onchange="ui.orderSort=this.value;render()"><option value="date" ${ui.orderSort==='date'?'selected':''}>Sort by date</option><option value="market" ${ui.orderSort==='market'?'selected':''}>Sort by market</option><option value="product" ${ui.orderSort==='product'?'selected':''}>Sort by product</option></select></div></div><div class="v4-orders">${rows.map(v4OrderCard).join('')||'<div class="empty-admin">No orders yet. Checkout requests will appear here.</div>'}</div>`}
function v4OrderCard(o){let s=S(o.storeId),products=o.products?.length?o.products.map(x=>`${x.qty||1} × ${x.name}`).join(', '):'Order request';return `<article class="v4-order"><div><strong>${E(o.id)}</strong><small>${v4Date(o.createdAt)}</small></div><div><strong>${E(products)}</strong><small>${E(o.name||'Customer')} ${o.city?'· '+E(o.city):''}</small></div><div><strong>${E(s?.name||'Marketplace')}</strong><small>${E(o.customerPhone||'WhatsApp order')}</small></div><div class="amount">${money(o.total||0)}</div><button class="v4-whatsapp" onclick="v4MessageOrder('${o.id}')">WhatsApp</button></article>`}
function v4MessageOrder(id){let o=data.orders.find(x=>x.id===id),s=S(o?.storeId),phone=s?.wa||data.settings.mainWa;if(!o)return;let msg=o.whatsappMessage||`Order ${o.id}\nCustomer: ${o.name||''}\nTotal: ${money(o.total||0)}`;open('https:'+'//wa.me/'+String(phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}

function v4Markets(){return `<div class="adminbar"><div><span class="eye">Markets</span><h2>All markets</h2></div><button class="btn dark" onclick="v4AddMarket()">+ Add market</button></div><div class="v4-market-list">${data.stores.map(v4MarketCard).join('')}</div>`}
function v4MarketCard(s){const open=ui.marketId===s.id;return `<article class="v4-market-card"><div class="v4-market-summary"><img src="${E(s.logo||s.cover||V2PH)}" alt=""><div class="v4-market-copy"><strong>${E(s.name)}</strong><small>${E(s.city)} · ${data.products.filter(p=>p.store===s.id).length} products</small><span class="v4-badge ${s.hidden?'hidden':''}">${s.hidden?'Hidden':'Active'}</span></div><div class="v4-actions"><button onclick="ui.marketId='${open?'':s.id}';render()">${open?'Close editor':'Edit market'}</button><button class="${s.hidden?'active':'hidden'}" onclick="v4ToggleMarket('${s.id}')">${s.hidden?'Show':'Hide'}</button><button class="danger" onclick="v4DeleteMarket('${s.id}')">Delete</button></div></div>${open?v4MarketEditor(s):''}</article>`}
function v4MarketEditor(s){return `<div class="v4-editor"><div class="v4-media-pair"><div class="v4-upload-card logo"><img src="${E(s.logo||V2PH)}" alt="Logo"><h4>Market logo</h4><div class="v4-actions"><label>Upload / replace<input hidden type="file" accept="image/*" onchange="v4UploadMarketImage(event,'${s.id}','logo')"></label><button class="danger" onclick="v4RemoveMarketImage('${s.id}','logo')">Remove</button></div></div><div class="v4-upload-card"><img src="${E(s.cover||V2PH)}" alt="Cover"><h4>Cover page</h4><div class="v4-actions"><label>Upload / replace<input hidden type="file" accept="image/*" onchange="v4UploadMarketImage(event,'${s.id}','cover')"></label><button class="danger" onclick="v4RemoveMarketImage('${s.id}','cover')">Remove</button></div></div></div><form class="v4-form" onsubmit="v4SaveMarket(event,'${s.id}')"><label>Market name<input name="name" value="${E(s.name)}" required></label><label>Category<input name="cat" value="${E(s.cat||'Fashion')}"></label><label>City<input name="city" value="${E(s.city||'')}"></label><label>Contact phone<input name="phone" value="${E(s.phone||'')}"></label><label>WhatsApp<input name="wa" value="${E(s.wa||'')}"></label><label>Email<input type="email" name="email" value="${E(s.email||'')}"></label><label>Instagram<input name="instagram" value="${E(s.instagram||'')}" placeholder="https://instagram.com/..."></label><label>Facebook<input name="facebook" value="${E(s.facebook||'')}" placeholder="https://facebook.com/..."></label><label class="full">Website<input name="website" value="${E(s.website||'')}" placeholder="https://..."></label><label class="full">Address<input name="address" value="${E(s.address||'')}"></label><label class="full">Opening hours<input name="hours" value="${E(s.hours||'')}"></label><label class="full">Market description<textarea name="desc">${E(s.desc||'')}</textarea></label><div class="v4-actions full"><button class="dark">Save market information</button></div></form></div>`}
function v4AddMarket(){let name=prompt('Market name');if(!name)return;let id='market-'+Date.now();data.stores.push({id,slug:v4Slug(name),name,mono:name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),cat:'Fashion',city:'Morocco',rating:5,desc:'New marketplace store.',cover:V2PH,logo:V2PH,phone:'',wa:data.settings.mainWa,email:'',address:'',hours:'Mon–Sat',instagram:'',facebook:'',website:'',hidden:false,createdAt:new Date().toISOString()});ui.marketId=id;v4SafeSave();render()}
function v4SaveMarket(e,id){e.preventDefault();let s=S(id),f=Object.fromEntries(new FormData(e.target));Object.assign(s,f,{slug:v4Slug(f.name),wa:String(f.wa||'').replace(/\D/g,'')});v4SafeSave();render();toast('Market saved')}
function v4ToggleMarket(id){let s=S(id);s.hidden=!s.hidden;v4SafeSave();render();toast(s.hidden?'Market hidden':'Market visible')}
function v4DeleteMarket(id){let s=S(id),count=data.products.filter(p=>p.store===id).length;if(confirm(`Delete ${s.name} and its ${count} products?`)){data.stores=data.stores.filter(x=>x.id!==id);data.products=data.products.filter(x=>x.store!==id);if(ui.productMarketId===id)ui.productMarketId=data.stores[0]?.id||'';ui.marketId='';v4SafeSave();render()}}
async function v4UploadMarketImage(e,id,key){let f=e.target.files?.[0];if(!f)return;let url=await v4ImageData(f,key==='logo'?900:1800);if(!url)return;S(id)[key]=url;if(v4SafeSave()){render();toast(`${key==='logo'?'Logo':'Cover'} uploaded`)}}
function v4RemoveMarketImage(id,key){S(id)[key]=V2PH;v4SafeSave();render()}

function v4Products(){let sid=ui.productMarketId||data.stores[0]?.id,market=S(sid);return `<div class="adminbar"><div><span class="eye">Products</span><h2>Products by market</h2></div>${market?`<button class="btn dark" onclick="v4AddProduct('${market.id}')">+ Add product</button>`:''}</div><div class="v4-market-grid">${data.stores.map(s=>`<button class="v4-market-select ${sid===s.id?'on':''}" onclick="ui.productMarketId='${s.id}';ui.productId='';render()"><strong>${E(s.name)}</strong><small>${data.products.filter(p=>p.store===s.id).length} products · ${s.hidden?'hidden market':'active market'}</small></button>`).join('')}</div>${market?`<section class="v4-section"><div class="v4-section-head"><div><span class="eye">${E(market.name)}</span><h3>Product list</h3></div><button class="btn dark" onclick="v4AddProduct('${market.id}')">+ Add product</button></div><div class="v4-product-list">${data.products.filter(p=>p.store===market.id).map(v4ProductRow).join('')||'<div class="empty-admin">No products in this market yet.</div>'}</div></section>`:''}`}
function v4ProductRow(p){let open=ui.productId===p.id;return `<article class="v4-product-row"><div class="v4-product-summary"><img src="${E(v4FirstImage(p))}" alt=""><div class="v4-product-copy"><strong>${E(p.name)}</strong><small>${v4MediaOf(p).length}/10 media · ${money(p.base)} ${p.sale?'→ '+money(p.sale):'· no promo'}</small><span class="v4-badge ${p.hidden?'hidden':''}">${p.hidden?'Hidden':'Visible'}</span></div><div class="v4-actions"><button onclick="ui.productId='${open?'':p.id}';render()">${open?'Close editor':'Edit product'}</button><button class="${p.hidden?'active':'hidden'}" onclick="v4ToggleProduct('${p.id}')">${p.hidden?'Show':'Hide'}</button><button class="danger" onclick="v4DeleteProduct('${p.id}')">Delete</button></div></div>${open?v4ProductEditor(p):''}</article>`}
function v4ProductEditor(p){let media=v4MediaOf(p);return `<div class="v4-product-editor"><form class="v4-form" onsubmit="v4SaveProduct(event,'${p.id}')"><label>Product name<input name="name" value="${E(p.name)}" required></label><label>Category<input name="cat" value="${E(p.cat||'Fashion')}"></label><label>Regular price<input type="number" min="0" step="0.01" name="base" value="${p.base||0}"></label><label class="v4-promo">Promotion<select name="promo"><option value="no" ${p.sale?'':'selected'}>No — regular price</option><option value="yes" ${p.sale?'selected':''}>Yes — use promo price</option></select></label><label>Promo price<input type="number" min="0" step="0.01" name="sale" value="${p.sale||''}" placeholder="Example: 299"></label><label>Visibility<select name="hidden"><option value="no" ${p.hidden?'':'selected'}>Visible</option><option value="yes" ${p.hidden?'selected':''}>Hidden</option></select></label><label class="full">Description<textarea name="desc">${E(p.desc||'')}</textarea></label><div class="v4-actions full"><button class="dark">Save product information</button></div></form><div class="v4-section" style="margin-top:16px"><div class="v4-section-head"><div><span class="eye">Images & videos</span><h3>${media.length}/10 media</h3></div><div class="v4-actions"><label class="dark">Upload from device<input hidden multiple type="file" accept="image/*,video/*" onchange="v4UploadProductMedia(event,'${p.id}')"></label></div></div><div class="v4-media-note">Upload from PC or mobile. Images are optimized automatically. Short videos must be under 3 MB in this browser-based edition.</div><div class="v4-product-media">${media.length?media.map((m,i)=>v4ProductMediaCard(p,m,i)).join(''):'<div class="v4-media-empty">No media yet. Upload up to 10 images or videos.</div>'}</div></div><div class="v4-section" style="margin-top:16px"><div class="v4-section-head"><div><span class="eye">Sizes, colors & stock</span><h3>Variants</h3></div><button class="btn" onclick="v2addColor('${p.id}')">+ Add color</button></div><div style="padding:14px">${p.colors.map((c,i)=>v2colorPanel(p,c,i)).join('')}</div></div></div>`}
function v4ProductMediaCard(p,m,i){return `<article class="v4-media-item">${m.type==='video'?`<video src="${E(m.url)}" controls muted playsinline></video>`:`<img src="${E(m.url)}" alt="">`}<small>${E(m.name||`${m.type} ${i+1}`)}</small><div class="v4-media-actions"><button onclick="v4MoveProductMedia('${p.id}',${i},-1)">←</button><button onclick="v4MoveProductMedia('${p.id}',${i},1)">→</button><label>Replace<input hidden type="file" accept="image/*,video/*" onchange="v4ReplaceProductMedia(event,'${p.id}',${i})"></label><button class="danger" onclick="v4DeleteProductMedia('${p.id}',${i})">×</button></div></article>`}
function v4AddProduct(storeId){let name=prompt('Product name');if(!name)return;let id='product-'+Date.now();data.products.push({id,slug:v4Slug(name),store:storeId,name,cat:'Fashion',desc:'New product description.',base:Number(prompt('Regular price','499')||499),sale:null,featured:false,hidden:false,createdAt:new Date().toISOString(),media:[],colors:[{name:'Default',hex:'#222222',images:[V2PH],sizes:[sz('One size','SKU-'+Date.now(),1)]}]});ui.productId=id;v4SafeSave();render()}
function v4SaveProduct(e,id){e.preventDefault();let p=v2p(id),f=Object.fromEntries(new FormData(e.target));p.name=f.name;p.slug=v4Slug(f.name);p.cat=f.cat;p.desc=f.desc;p.base=Number(f.base||0);p.sale=f.promo==='yes'&&Number(f.sale)>0?Number(f.sale):null;p.hidden=f.hidden==='yes';v4SafeSave();render();toast('Product saved')}
function v4ToggleProduct(id){let p=v2p(id);p.hidden=!p.hidden;v4SafeSave();render();toast(p.hidden?'Product hidden':'Product visible')}
function v4DeleteProduct(id){let p=v2p(id);if(confirm(`Delete ${p.name}?`)){data.products=data.products.filter(x=>x.id!==id);ui.productId='';v4SafeSave();render()}}
async function v4UploadProductMedia(e,id){let p=v2p(id),files=[...e.target.files||[]],slots=10-v4MediaOf(p).length;if(slots<=0)return toast('Maximum 10 media per product');for(const f of files.slice(0,slots)){let type=f.type.startsWith('video/')?'video':'image',url=type==='video'?await v4VideoData(f):await v4ImageData(f,1800);if(url)p.media.push({id:'media-'+Date.now()+'-'+Math.random().toString(16).slice(2),type,url,name:f.name})}v4SyncProductImages(p);if(v4SafeSave()){render();toast('Product media uploaded')}}
async function v4ReplaceProductMedia(e,id,index){let f=e.target.files?.[0],p=v2p(id);if(!f)return;let type=f.type.startsWith('video/')?'video':'image',url=type==='video'?await v4VideoData(f):await v4ImageData(f,1800);if(!url)return;p.media[index]={...p.media[index],type,url,name:f.name};v4SyncProductImages(p);if(v4SafeSave()){render();toast('Media replaced')}}
function v4DeleteProductMedia(id,index){let p=v2p(id);p.media.splice(index,1);v4SyncProductImages(p);v4SafeSave();render()}
function v4MoveProductMedia(id,index,d){let p=v2p(id),to=index+d;if(to<0||to>=p.media.length)return;[p.media[index],p.media[to]]=[p.media[to],p.media[index]];v4SyncProductImages(p);v4SafeSave();render()}
function v4VideoData(file){return new Promise(resolve=>{if(file.size>3000000){toast('Video must be below 3 MB for browser storage');return resolve('')}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve('');r.readAsDataURL(file)})}
function v4ImageData(file,max=1800){return new Promise(resolve=>{if(!file?.type?.startsWith('image/'))return resolve('');let url=URL.createObjectURL(file),img=new Image;img.onload=()=>{let scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(c.toDataURL('image/webp',.82))};img.onerror=()=>{URL.revokeObjectURL(url);resolve('')};img.src=url})}

function v4Homepage(){return `<div class="adminbar"><div><span class="eye">Homepage</span><h2>Website identity, images & content</h2></div><button class="btn dark" onclick="go('/')">View website</button></div><div class="v4-home-grid"><section class="v4-home-card"><h3>Website name & logo</h3><form class="v4-form" onsubmit="v4SaveHomeIdentity(event)"><label class="full">Website name<input name="name" value="${E(data.settings.name)}" required></label><label class="full">Logo alternative text<input name="logoAlt" value="${E(data.settings.logoAlt||data.settings.name)}"></label><div class="v4-upload-card logo full"><img src="${E(data.settings.logo||V2PH)}" alt="Logo"><div class="v4-actions"><label>Upload / replace logo<input hidden type="file" accept="image/*" onchange="v4UploadHomepageImage(event,'logo')"></label><button class="danger" type="button" onclick="data.settings.logo='';v4SafeSave();render()">Remove</button></div></div><div class="v4-actions full"><button class="dark">Save website identity</button></div></form></section><section class="v4-home-card"><h3>Hero section</h3><img class="v4-home-preview" src="${E(data.settings.heroImage||V2PH)}" alt=""><form class="v4-form" onsubmit="v4SaveHero(event)"><label class="full">Announcement<input name="notice" value="${E(data.settings.notice||'')}"></label><label class="full">Hero headline<textarea name="title">${E(data.settings.heroTitle||'')}</textarea></label><label class="full">Hero introduction<textarea name="text">${E(data.settings.heroText||'')}</textarea></label><div class="v4-actions full"><label>Upload / replace hero<input hidden type="file" accept="image/*" onchange="v4UploadHomepageImage(event,'heroImage')"></label><button class="dark">Save hero content</button></div></form></section></div><section class="v4-section"><div class="v4-section-head"><div><span class="eye">Homepage layout</span><h3>Images, text and section order</h3></div><button class="btn dark" onclick="v3AddBlock()">+ Add section</button></div>${data.homeBlocks.map((b,i)=>`<div class="v4-block-row"><div class="v4-block-order"><button onclick="v3MoveBlock('${b.id}',-1)">↑</button><button onclick="v3MoveBlock('${b.id}',1)">↓</button></div><img src="${E(b.image||V2PH)}" alt=""><div><span class="layout-badge">${E(b.type)}</span><strong style="display:block">${E(b.title)}</strong><small>${E(b.text||'')}</small></div><div class="v4-actions"><label>Upload image<input hidden type="file" accept="image/*" onchange="v4UploadHomepageImage(event,'block','${b.id}')"></label><button onclick="v3EditBlock('${b.id}')">Edit text</button><button class="${b.enabled===false?'hidden':'active'}" onclick="v3ToggleBlock('${b.id}')">${b.enabled===false?'Show':'Hide'}</button><button class="danger" onclick="v3DeleteBlock('${b.id}')">Delete</button></div></div>`).join('')}</section><section class="featured-manager"><span class="eye">Featured products</span><h3>Choose products for the homepage</h3><div class="featured-list">${data.products.filter(p=>!p.hidden).map(p=>`<label class="featured-item"><img src="${E(v4FirstImage(p))}" alt=""><span>${E(p.name)}</span><input type="checkbox" ${p.featured?'checked':''} onchange="v3ToggleFeatured('${p.id}',this.checked)"></label>`).join('')}</div></section>`}
function v4SaveHomeIdentity(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));data.settings.name=f.name;data.settings.logoAlt=f.logoAlt||f.name;data.settings.seoTitle=`${f.name} — Fashion Marketplace`;v4SafeSave();render();toast('Website identity saved')}
function v4SaveHero(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{notice:f.notice,heroTitle:f.title,heroText:f.text});v4SafeSave();render();toast('Homepage content saved')}
async function v4UploadHomepageImage(e,key,id){let f=e.target.files?.[0];if(!f)return;let url=await v4ImageData(f,key==='logo'?900:1800);if(!url)return;if(key==='block'){let b=data.homeBlocks.find(x=>x.id===id);if(b)b.image=url}else data.settings[key]=url;if(v4SafeSave()){render();toast('Homepage image uploaded')}}

const v4BaseStoreCard=storeCard,v4BaseProductCard=productCard,v4BaseStorePage=storePage;
storeCard=function(s){return s.hidden?'':v4BaseStoreCard(s)};
productCard=function(p){return p.hidden||S(p.store)?.hidden?'':v4BaseProductCard(p)};
storePage=function(slug){let s=data.stores.find(x=>x.slug===slug);if(!s||s.hidden)return empty();let h=v4BaseStorePage(slug),social=[s.instagram&&`<a target="_blank" href="${E(s.instagram)}">Instagram ↗</a>`,s.facebook&&`<a target="_blank" href="${E(s.facebook)}">Facebook ↗</a>`,s.website&&`<a target="_blank" href="${E(s.website)}">Website ↗</a>`].filter(Boolean).join('');return social?h.replace('</aside>',`<div class="v4-socials">${social}</div></aside>`):h};

yle="width:100%;margin-top:8px;border-color:#438066;color:#35745d" ${v?'':'disabled'} onclick="buyNow('${p.slug}')">◔ Buy through WhatsApp →</button></section></div><section class="section">${heading('KEEP EXPLORING','You may also like')}<div class="product-grid">${v4ActiveProducts().filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></section></main>${footer()}`};

home=function(){return `${header()}<main><section class="hero"><img src="${E(data.settings.heroImage||V2PH)}" alt=""><div class="hero-copy wrap"><span class="eye">THE NEW MOROCCAN MARKETPLACE</span><h1>${E(data.settings.heroTitle)}</h1><p>${E(data.settings.heroText)}</p><div class="buttons"><a data-go class="btn dark" href="/stores">Explore stores →</a><a class="btn glass" href="#new">Shop the new edit</a></div></div></section><div class="cats wrap">${data.categories.map(c=>`<button onclick="go('/stores')">${E(c.name)}</button>`).join('')}</div>${data.homeBlocks.map(v4HomeBlock).join('')}</main>${footer()}`};
