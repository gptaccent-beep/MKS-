function save(){localStorage.setItem('vetra-data',JSON.stringify(data));localStorage.setItem('vetra-cart',JSON.stringify(cart))}function theme(){let t=themes[data.settings.theme];for(let k of['p','a','bg','card','ink'])document.documentElement.style.setProperty('--'+k,t[k])}function go(path){history.pushState({},'',path);ui.color=ui.pic=0;ui.size='';ui.qty=1;ui.review=false;render();scrollTo({top:0,behavior:'smooth'})}function links(){document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))})}function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function header(){let n=cart.reduce((a,x)=>a+x.qty,0);return `<div class="notice">${E(data.settings.notice)}</div><header class="header"><nav class="nav wrap"><a data-go class="logo" href="/">${E(data.settings.name)} <b>◆</b></a><div class="links"><a data-go href="/stores">Stores</a><a data-go href="/stores">Women</a><a data-go href="/stores">Men</a><a data-go href="/stores">Accessories</a><a href="/#new">New edit</a></div><div class="actions"><button class="icon" onclick="searchAll()">⌕</button><button class="bag" onclick="drawer()">♧ Bag ${n?`<b class="badge">${n}</b>`:''}</button></div></nav></header>`}function footer(){return `<footer class="footer"><div class="foot wrap"><div><b class="logo">VETRA ◆</b><p>A curated marketplace for independent fashion stores across Morocco.</p></div><div><h4>DISCOVER</h4><a data-go href="/stores">All stores</a><a>New arrivals</a><a>Sale edit</a></div><div><h4>SERVICE</h4><a>Contact</a><a>Delivery & returns</a><a>Privacy</a></div><div><h4>A BETTER INBOX</h4><p>Store launches, edits and private offers—occasionally.</p><input class="input" placeholder="Email address"></div></div><div class="copy wrap"><span>© 2026 VETRA</span><span>INDEPENDENT FASHION</span></div></footer>`}function heading(eye,title,text='',link=''){return `<div class="head"><div><span class="eye">${eye}</span><h2>${title}</h2>${text?`<p>${text}</p>`:''}</div>${link?`<a data-go href="${link}">View all →</a>`:''}</div>`}function storeCard(s){return `<a data-go href="/store/${s.slug}" class="store-card"><div class="photo"><img src="${s.cover}"></div><div class="store-meta"><b class="mono">${s.mono}</b><div><small>${E(s.cat)} · ${E(s.city)}</small><h3>${E(s.name)}</h3></div><span>★ ${s.rating}</span></div></a>`}function productCard(p){return `<article class="product-card"><a data-go href="/product/${p.slug}" class="photo"><img src="${img(p)}">${p.new?'<b class="tag">NEW</b>':''}${p.sale?'<b class="tag sale">SALE</b>':''}</a><div class="pcopy"><small>${E(S(p.store).name)}</small><a data-go href="/product/${p.slug}"><h3>${E(p.name)}</h3></a><div class="pmeta"><b>${money(p.sale||p.base)} ${p.sale?`<i class="old">${money(p.base)}</i>`:''}</b><span class="dots">${p.colors.map(c=>`<i style="background:${c.hex}"></i>`).join('')}</span></div></div></article>`}
function home(){return `${header()}<main><section class="hero"><img src="/assets/hero.webp"><div class="hero-copy wrap"><span class="eye">THE NEW MOROCCAN MARKETPLACE</span><h1>${E(data.settings.heroTitle)}</h1><p>${E(data.settings.heroText)}</p><div class="buttons"><a data-go class="btn dark" href="/stores">Explore stores →</a><a class="btn glass" href="#new">Shop the new edit</a></div></div></section><div class="cats wrap">${['Women','Men','Kids','Shoes','Accessories','New arrivals','Sale'].map(x=>`<button onclick="go('/stores')">${x}</button>`).join('')}</div><section class="section wrap">${heading('THE STORE DIRECTORY','Distinct points of view','Meet independent names shaping a more personal way to shop.','/stores')}<div class="store-grid">${data.stores.map(storeCard).join('')}</div></section><section class="section alt" id="new"><div class="wrap">${heading('THE WEEKLY EDIT','New, noteworthy, now','A small selection worth knowing.','/stores')}<div class="product-grid">${data.products.filter(x=>x.featured).map(productCard).join('')}</div></div></section><section class="editorial wrap"><img src="/assets/accessories.webp"><div class="editorial-copy"><span class="eye">OBJECTS OF DESIRE</span><h2>Details do the talking.</h2><p>Soft leather, sculptural metal and silk with a story.</p><a data-go class="btn dark" href="/store/sienna-objects">Shop Sienna Objects →</a></div></section><section class="section wrap">${heading('MOST WANTED','The pieces moving fastest')}<div class="product-grid">${data.products.slice(0,4).map(productCard).join('')}</div></section><section class="newsletter wrap"><div><span class="eye">THE VETRA LETTER</span><h2>Considered style,<br><i>delivered lightly.</i></h2><p>New stores and thoughtful edits. No noise.</p></div></section></main>${footer()}`}
function storesPage(){return `${header()}<main class="page wrap"><div class="title"><span class="eye">CURATED DIRECTORY</span><h1>Stores with<br><i>something to say.</i></h1><p>Independent fashion and objects from across Morocco.</p></div><div class="toolbar"><input class="input" oninput="filterStores(this.value)" placeholder="Search stores or cities"><div class="chips"><button class="on">All</button><button>Women</button><button>Men</button><button>Accessories</button></div></div><div id="stores" class="store-grid">${data.stores.map(storeCard).join('')}</div><section class="section">${heading('ACROSS THE MARKET','A first look')}<div class="product-grid">${data.products.slice(0,4).map(productCard).join('')}</div></section></main>${footer()}`}
function storePage(slug){let s=data.stores.find(x=>x.slug===slug);if(!s)return empty();let ps=data.products.filter(x=>x.store===s.id);return `${header()}<main><section class="store-hero"><img src="${s.cover}"><div class="inside wrap"><b class="mono">${s.mono}</b><div><span class="eye" style="color:#fff">${E(s.cat)} · ${E(s.city)}</span><h1>${E(s.name)}</h1><p>${E(s.desc)}</p></div></div></section><div class="store-layout wrap"><aside class="info"><span class="eye">STORE INFORMATION</span><h2>Come say hello.</h2><a target="_blank" href="${'https:'+'//wa.me/'+s.wa}">◔ WhatsApp ↗</a><a href="tel:${s.phone}">☎ ${E(s.phone)}</a><a href="mailto:${s.email}">✉ ${E(s.email)}</a><a target="_blank" href="${'https:'+'//maps.google.com/?q='+encodeURIComponent(s.address)}">⌖ ${E(s.address)} ↗</a><p><small>OPENING HOURS</small><br><b>${E(s.hours)}</b></p></aside><section><div class="catalog-head"><div><span class="eye">THE COLLECTION</span><h2>${ps.length} pieces</h2></div><select onchange="sortProducts(this.value,'${s.id}')"><option value="popular">Most popular</option><option value="low">Price low to high</option><option value="high">Price high to low</option></select></div><div id="catalog" class="product-grid two">${ps.map(productCard).join('')}</div></section></div></main>${footer()}`}
function productPage(slug){let p=P(slug);if(!p)return empty();let s=S(p.store),c=p.colors[ui.color],v=c.sizes.find(x=>x.n===ui.size),u=v?.price||p.sale||p.base;return `${header()}<main class="page wrap"><p style="font-size:10px;color:var(--muted)">Home / ${E(s.name)} / ${E(p.name)}</p><div class="detail"><div class="gallery"><div class="thumbs">${c.images.map((x,i)=>`<button class="${ui.pic===i?'on':''}" onclick="setPic(${i})"><img src="${x}"></button>`).join('')}</div><div class="mainpic"><img src="${c.images[ui.pic]||c.images[0]}"></div></div><section class="buy"><a data-go class="eye" href="/store/${s.slug}">${E(s.name)} →</a><h1>${E(p.name)}</h1><b style="font-size:18px">${money(u)} ${p.sale?`<i class="old">${money(p.base)}</i>`:''}</b><p class="desc">${E(p.desc)}</p><div class="option"><label>Color · <b>${E(c.name)}</b></label><div class="colors">${p.colors.map((x,i)=>`<button class="${ui.color===i?'on':''}" onclick="setColor(${i})"><i style="background:${x.hex}"></i>${E(x.name)}</button>`).join('')}</div></div><div class="option"><label>Size</label><div class="sizes">${c.sizes.map(x=>`<button class="${ui.size===x.n?'on':''}" onclick="setSize('${E(x.n)}')">${E(x.n)}</button>`).join('')}</div>${v?`<p style="color:#387457;font-size:10px">● In stock · SKU ${v.sku}</p>`:''}</div><div class="qtyrow"><div class="qty"><button onclick="setQty(-1)">−</button><span>${ui.qty}</span><button onclick="setQty(1)">+</button></div><button class="btn dark grow" ${v?'':'disabled'} onclick="addCart('${p.slug}')">${v?'Add to bag':'Select a size'} · ${money(u*ui.qty)}</button></div><button class="btn" style="width:100%;margin-top:8px;border-color:#438066;color:#35745d" ${v?'':'disabled'} onclick="buyNow('${p.slug}')">◔ Buy through WhatsApp →</button><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:15px;color:var(--muted);font-size:11px"><b>CARE</b><p>Follow the garment care label. Returns accepted within 7 days.</p><b>DELIVERY</b><p>Dispatches in 1–2 business days.</p></div></section></div><section class="section">${heading('KEEP EXPLORING','You may also like')}<div class="product-grid">${data.products.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></section></main>${footer()}`}
function cartRows(){return cart.map(i=>{let p=data.products.find(x=>x.id===i.product),s=S(p.store),c=p.colors.find(x=>x.name===i.color),v=c.sizes.find(x=>x.n===i.size);return{i,p,s,c,v,u:v.price||p.sale||p.base}})}function drawer(){let rs=cartRows(),sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0);document.querySelector('#overlay').innerHTML=`<div class="drawerback" onclick="closeDrawer()"></div><aside class="drawer"><div class="drawer-head"><h2>Shopping bag</h2><button class="icon" onclick="closeDrawer()">×</button></div><div class="drawer-body">${rs.length?rs.map(x=>`<div class="mini"><img src="${x.c.images[0]}"><div><small>${E(x.s.name)}</small><b>${E(x.p.name)}</b><p>${E(x.c.name)} · ${E(x.v.n)}</p><div class="qty"><button onclick="cartQty('${x.i.uid}',-1)">−</button><span>${x.i.qty}</span><button onclick="cartQty('${x.i.uid}',1)">+</button></div></div><button class="icon" onclick="removeCart('${x.i.uid}')">×</button></div>`).join(''):'<div class="empty"><h2>Your bag is empty</h2></div>'}</div>${rs.length?`<div class="drawer-foot"><div class="line"><span>Subtotal</span><b>${money(sub)}</b></div><a data-go class="btn dark" style="width:100%" href="/checkout">Checkout →</a></div>`:''}</aside>`;links()}function closeDrawer(){document.querySelector('#overlay').innerHTML=''}
function cartPage(){let rs=cartRows(),groups=Object.values(rs.reduce((a,x)=>{(a[x.s.id]||={s:x.s,items:[]}).items.push(x);return a},{})),sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0),del=rs.length?data.settings.delivery:0;return `${header()}<main class="page wrap"><div class="title"><span class="eye">YOUR SELECTION</span><h1>Shopping bag</h1><p>${cart.reduce((n,x)=>n+x.qty,0)} items from ${groups.length} stores</p></div>${rs.length?`<div class="cart-layout"><section>${groups.map(g=>`<div class="cartgroup"><h3>${E(g.s.name)}</h3>${g.items.map(x=>`<div class="cartitem"><img src="${x.c.images[0]}"><div><small>${E(x.s.name)}</small><h3>${E(x.p.name)}</h3><p>${E(x.c.name)} · ${E(x.v.n)} · ${x.v.sku}</p><div class="qty"><button onclick="cartQty('${x.i.uid}',-1)">−</button><span>${x.i.qty}</span><button onclick="cartQty('${x.i.uid}',1)">+</button></div><button class="icon" onclick="removeCart('${x.i.uid}')">⌫</button></div><b>${money(x.u*x.i.qty)}</b></div>`).join('')}</div>`).join('')}</section><aside class="summary"><span class="eye">ORDER SUMMARY</span><h2>The total</h2><div class="line"><span>Subtotal</span><b>${money(sub)}</b></div><div class="line"><span>Delivery</span><b>${money(del)}</b></div><div class="line total"><span>Total</span><b>${money(sub+del)}</b></div><a data-go class="btn dark" style="width:100%;margin-top:15px" href="/checkout">Continue to checkout →</a></aside></div>`:'<div class="empty"><h2>Your bag is empty</h2><a data-go class="btn dark" href="/stores">Browse stores →</a></div>'}</main>${footer()}`}
function checkout(){let rs=cartRows();if(!rs.length)return empty();let sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0),f=ui.form||{};return `${header()}<main class="page wrap"><div class="title"><span class="eye">WHATSAPP CHECKOUT</span><h1>${ui.review?'Review & send':'Where should it go?'}</h1><p>We format every product detail into a clear WhatsApp request.</p></div><div class="checkout-layout"><section>${!ui.review?`<form onsubmit="reviewOrder(event)"><div class="formsection"><h2>Contact</h2><div class="formgrid"><label>Full name<input name="name" required></label><label>Phone<input name="phone" required></label></div></div><div class="formsection"><h2>Delivery</h2><div class="formgrid"><label class="full">Full address<input name="address" required></label><label>City<input name="city" required></label><label>Landmark<input name="details"></label><label class="full">Notes<textarea name="notes"></textarea></label></div></div><button class="btn dark" style="width:100%">Review order →</button></form>`:`<div class="formsection"><span class="eye">DELIVER TO</span><h2>${E(f.name)}</h2><p>${E(f.address)}, ${E(f.city)}<br>${E(f.phone)}</p><button class="btn" onclick="ui.review=false;render()">Edit details</button><hr><span class="eye">SEND ORDER</span>${Object.values(rs.reduce((a,x)=>{(a[x.s.id]||={s:x.s,items:[]}).items.push(x);return a},{})).map(g=>`<button class="send" onclick="sendOrder('${g.s.id}')"><b class="mono">${g.s.mono}</b><span><small>SEND TO STORE</small><b>${E(g.s.name)}</b></span>→</button>`).join('')}<button class="btn dark" style="width:100%;margin-top:14px" onclick="cart=[];save();go('/order-confirmation')">I’ve sent my message →</button></div>`}</section><aside class="summary"><span class="eye">YOUR ORDER</span>${rs.map(x=>`<div class="mini"><img src="${x.c.images[0]}"><div><b>${E(x.p.name)}</b><p>${E(x.c.name)} · ${E(x.v.n)} · Qty ${x.i.qty}</p></div><b>${money(x.u*x.i.qty)}</b></div>`).join('')}<div class="line total"><span>Total</span><b>${money(sub+data.sett
