const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),S=id=>data.stores.find(x=>x.id===id),P=slug=>data.products.find(x=>x.slug===slug),money=n=>new Intl.NumberFormat('en-MA',{maximumFractionDigits:0}).format(n)+' '+data.settings.currency,img=p=>p.colors[0].images[0];
function save(){localStorage.setItem('vetra-data',JSON.stringify(data));localStorage.setItem('vetra-cart',JSON.stringify(cart))}function theme(){let t=themes[data.settings.theme];for(let k of['p','a','bg','card','ink'])document.documentElement.style.setProperty('--'+k,t[k])}function go(path){history.pushState({},'',path);ui.color=ui.pic=0;ui.size='';ui.qty=1;ui.review=false;render();scrollTo({top:0,behavior:'smooth'})}function links(){document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))})}function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function header(){let n=cart.reduce((a,x)=>a+x.qty,0);return `<div class="notice">${E(data.settings.notice)}</div><header class="header"><nav class="nav wrap"><a data-go class="logo" href="/">${E(data.settings.name)} <b>◆</b></a><div class="links"><a data-go href="/stores">Stores</a><a data-go href="/stores">Women</a><a data-go href="/stores">Men</a><a data-go href="/stores">Accessories</a><a href="/#new">New edit</a></div><div class="actions"><button class="icon" onclick="searchAll()">⌕</button><button class="bag" onclick="drawer()">♧ Bag ${n?`<b class="badge">${n}</b>`:''}</button></div></nav></header>`}function footer(){return `<footer class="footer"><div class="foot wrap"><div><b class="logo">VETRA ◆</b><p>A curated marketplace for independent fashion stores across Morocco.</p></div><div><h4>DISCOVER</h4><a data-go href="/stores">All stores</a><a>New arrivals</a><a>Sale edit</a></div><div><h4>SERVICE</h4><a>Contact</a><a>Delivery & returns</a><a>Privacy</a></div><div><h4>A BETTER INBOX</h4><p>Store launches, edits and private offers—occasionally.</p><input class="input" placeholder="Email address"></div></div><div class="copy wrap"><span>© 2026 VETRA</span><span>INDEPENDENT FASHION</span></div></footer>`}function heading(eye,title,text='',link=''){return `<div class="head"><div><span class="eye">${eye}</span><h2>${title}</h2>${text?`<p>${text}</p>`:''}</div>${link?`<a data-go href="${link}">View all →</a>`:''}</div>`}function storeCard(s){return `<a data-go href="/store/${s.slug}" class="store-card"><div class="photo"><img src="${s.cover}"></div><div class="store-meta"><b class="mono">${s.mono}</b><div><small>${E(s.cat)} · ${E(s.city)}</small><h3>${E(s.name)}</h3></div><span>★ ${s.rating}</span></div></a>`}function productCard(p){return `<article class="product-card"><a data-go href="/product/${p.slug}" class="photo"><img src="${img(p)}">${p.new?'<b class="tag">NEW</b>':''}${p.sale?'<b class="tag sale">SALE</b>':''}</a><div class="pcopy"><small>${E(S(p.store).name)}</small><a data-go href="/product/${p.slug}"><h3>${E(p.name)}</h3></a><div class="pmeta"><b>${money(p.sale||p.base)} ${p.sale?`<i class="old">${money(p.base)}</i>`:''}</b><span class="dots">${p.colors.map(c=>`<i style="background:${c.hex}"></i>`).join('')}</span></div></div></article>`}
function home(){return `${header()}<main><section class="hero"><img src="/assets/hero.webp"><div class="hero-copy wrap"><span class="eye">THE NEW MOROCCAN MARKETPLACE</span><h1>${E(data.settings.heroTitle)}</h1><p>${E(data.settings.heroText)}</p><div class="buttons"><a data-go class="btn dark" href="/stores">Explore stores →</a><a class="btn glass" href="#new">Shop the new edit</a></div></div></section><div class="cats wrap">${['Women','Men','Kids','Shoes','Accessories','New arrivals','Sale'].map(x=>`<button onclick="go('/stores')">${x}</button>`).join('')}</div><section class="section wrap">${heading('THE STORE DIRECTORY','Distinct points of view','Meet independent names shaping a more personal way to shop.','/stores')}<div class="store-grid">${data.stores.map(storeCard).join('')}</div></section><section class="section alt" id="new"><div class="wrap">${heading('THE WEEKLY EDIT','New, noteworthy, now','A small selection worth knowing.','/stores')}<div class="product-grid">${data.products.filter(x=>x.featured).map(productCard).join('')}</div></div></section><section class="editorial wrap"><img src="/assets/accessories.webp"><div class="editorial-copy"><span class="eye">OBJECTS OF DESIRE</span><h2>Details do the talking.</h2><p>Soft leather, sculptural metal and silk with a story.</p><a data-go class="btn dark" href="/store/sienna-objects">Shop Sienna Objects →</a></div></section><section class="section wrap">${heading('MOST WANTED','The pieces moving fastest')}<div class="product-grid">${data.products.slice(0,4).map(productCard).join('')}</div></section><section class="newsletter wrap"><div><span class="eye">THE VETRA LETTER</span><h2>Considered style,<br><i>delivered lightly.</i></h2><p>New stores and thoughtful edits. No noise.</p></div></section></main>${footer()}`}
function storesPage(){return `${header()}<main class="page wrap"><div class="title"><span class="eye">CURATED DIRECTORY</span><h1>Stores with<br><i>something to say.</i></h1><p>Independent fashion and objects from across Morocco.</p></div><div class="toolbar"><input class="input" oninput="filterStores(this.value)" placeholder="Search stores or cities"><div class="chips"><button class="on">All</button><button>Women</button><button>Men</button><button>Accessories</button></div></div><div id="stores" class="store-grid">${data.stores.map(storeCard).join('')}</div><section class="section">${heading('ACROSS THE MARKET','A first look')}<div class="product-grid">${data.products.slice(0,4).map(productCard).join('')}</div></section></main>${footer()}`}
function storePage(slug){let s=data.stores.find(x=>x.slug===slug);if(!s)return empty();let ps=data.products.filter(x=>x.store===s.id);return `${header()}<main><section class="store-hero"><img src="${s.cover}"><div class="inside wrap"><b class="mono">${s.mono}</b><div><span class="eye" style="color:#fff">${E(s.cat)} · ${E(s.city)}</span><h1>${E(s.name)}</h1><p>${E(s.desc)}</p></div></div></section><div class="store-layout wrap"><aside class="info"><span class="eye">STORE INFORMATION</span><h2>Come say hello.</h2><a target="_blank" href="${'https:'+'//wa.me/'+s.wa}">◔ WhatsApp ↗</a><a href="tel:${s.phone}">☎ ${E(s.phone)}</a><a href="mailto:${s.email}">✉ ${E(s.email)}</a><a target="_blank" href="${'https:'+'//maps.google.com/?q='+encodeURIComponent(s.address)}">⌖ ${E(s.address)} ↗</a><p><small>OPENING HOURS</small><br><b>${E(s.hours)}</b></p></aside><section><div class="catalog-head"><div><span class="eye">THE COLLECTION</span><h2>${ps.length} pieces</h2></div><select onchange="sortProducts(this.value,'${s.id}')"><option value="popular">Most popular</option><option value="low">Price low to high</option><option value="high">Price high to low</option></select></div><div id="catalog" class="product-grid two">${ps.map(productCard).join('')}</div></section></div></main>${footer()}`}
function productPage(slug){let p=P(slug);if(!p)return empty();let s=S(p.store),c=p.colors[ui.color],v=c.sizes.find(x=>x.n===ui.size),u=v?.price||p.sale||p.base;return `${header()}<main class="page wrap"><p style="font-size:10px;color:var(--muted)">Home / ${E(s.name)} / ${E(p.name)}</p><div class="detail"><div class="gallery"><div class="thumbs">${c.images.map((x,i)=>`<button class="${ui.pic===i?'on':''}" onclick="setPic(${i})"><img src="${x}"></button>`).join('')}</div><div class="mainpic"><img src="${c.images[ui.pic]||c.images[0]}"></div></div><section class="buy"><a data-go class="eye" href="/store/${s.slug}">${E(s.name)} →</a><h1>${E(p.name)}</h1><b style="font-size:18px">${money(u)} ${p.sale?`<i class="old">${money(p.base)}</i>`:''}</b><p class="desc">${E(p.desc)}</p><div class="option"><label>Color · <b>${E(c.name)}</b></label><div class="colors">${p.colors.map((x,i)=>`<button class="${ui.color===i?'on':''}" onclick="setColor(${i})"><i style="background:${x.hex}"></i>${E(x.name)}</button>`).join('')}</div></div><div class="option"><label>Size</label><div class="sizes">${c.sizes.map(x=>`<button class="${ui.size===x.n?'on':''}" onclick="setSize('${E(x.n)}')">${E(x.n)}</button>`).join('')}</div>${v?`<p style="color:#387457;font-size:10px">● In stock · SKU ${v.sku}</p>`:''}</div><div class="qtyrow"><div class="qty"><button onclick="setQty(-1)">−</button><span>${ui.qty}</span><button onclick="setQty(1)">+</button></div><button class="btn dark grow" ${v?'':'disabled'} onclick="addCart('${p.slug}')">${v?'Add to bag':'Select a size'} · ${money(u*ui.qty)}</button></div><button class="btn" style="width:100%;margin-top:8px;border-color:#438066;color:#35745d" ${v?'':'disabled'} onclick="buyNow('${p.slug}')">◔ Buy through WhatsApp →</button><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:15px;color:var(--muted);font-size:11px"><b>CARE</b><p>Follow the garment care label. Returns accepted within 7 days.</p><b>DELIVERY</b><p>Dispatches in 1–2 business days.</p></div></section></div><section class="section">${heading('KEEP EXPLORING','You may also like')}<div class="product-grid">${data.products.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></section></main>${footer()}`}
function cartRows(){return cart.map(i=>{let p=data.products.find(x=>x.id===i.product),s=S(p.store),c=p.colors.find(x=>x.name===i.color),v=c.sizes.find(x=>x.n===i.size);return{i,p,s,c,v,u:v.price||p.sale||p.base}})}function drawer(){let rs=cartRows(),sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0);document.querySelector('#overlay').innerHTML=`<div class="drawerback" onclick="closeDrawer()"></div><aside class="drawer"><div class="drawer-head"><h2>Shopping bag</h2><button class="icon" onclick="closeDrawer()">×</button></div><div class="drawer-body">${rs.length?rs.map(x=>`<div class="mini"><img src="${x.c.images[0]}"><div><small>${E(x.s.name)}</small><b>${E(x.p.name)}</b><p>${E(x.c.name)} · ${E(x.v.n)}</p><div class="qty"><button onclick="cartQty('${x.i.uid}',-1)">−</button><span>${x.i.qty}</span><button onclick="cartQty('${x.i.uid}',1)">+</button></div></div><button class="icon" onclick="removeCart('${x.i.uid}')">×</button></div>`).join(''):'<div class="empty"><h2>Your bag is empty</h2></div>'}</div>${rs.length?`<div class="drawer-foot"><div class="line"><span>Subtotal</span><b>${money(sub)}</b></div><a data-go class="btn dark" style="width:100%" href="/checkout">Checkout →</a></div>`:''}</aside>`;links()}function closeDrawer(){document.querySelector('#overlay').innerHTML=''}
function cartPage(){let rs=cartRows(),groups=Object.values(rs.reduce((a,x)=>{(a[x.s.id]||={s:x.s,items:[]}).items.push(x);return a},{})),sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0),del=rs.length?data.settings.delivery:0;return `${header()}<main class="page wrap"><div class="title"><span class="eye">YOUR SELECTION</span><h1>Shopping bag</h1><p>${cart.reduce((n,x)=>n+x.qty,0)} items from ${groups.length} stores</p></div>${rs.length?`<div class="cart-layout"><section>${groups.map(g=>`<div class="cartgroup"><h3>${E(g.s.name)}</h3>${g.items.map(x=>`<div class="cartitem"><img src="${x.c.images[0]}"><div><small>${E(x.s.name)}</small><h3>${E(x.p.name)}</h3><p>${E(x.c.name)} · ${E(x.v.n)} · ${x.v.sku}</p><div class="qty"><button onclick="cartQty('${x.i.uid}',-1)">−</button><span>${x.i.qty}</span><button onclick="cartQty('${x.i.uid}',1)">+</button></div><button class="icon" onclick="removeCart('${x.i.uid}')">⌫</button></div><b>${money(x.u*x.i.qty)}</b></div>`).join('')}</div>`).join('')}</section><aside class="summary"><span class="eye">ORDER SUMMARY</span><h2>The total</h2><div class="line"><span>Subtotal</span><b>${money(sub)}</b></div><div class="line"><span>Delivery</span><b>${money(del)}</b></div><div class="line total"><span>Total</span><b>${money(sub+del)}</b></div><a data-go class="btn dark" style="width:100%;margin-top:15px" href="/checkout">Continue to checkout →</a></aside></div>`:'<div class="empty"><h2>Your bag is empty</h2><a data-go class="btn dark" href="/stores">Browse stores →</a></div>'}</main>${footer()}`}
function checkout(){let rs=cartRows();if(!rs.length)return empty();let sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0),f=ui.form||{};return `${header()}<main class="page wrap"><div class="title"><span class="eye">WHATSAPP CHECKOUT</span><h1>${ui.review?'Review & send':'Where should it go?'}</h1><p>We format every product detail into a clear WhatsApp request.</p></div><div class="checkout-layout"><section>${!ui.review?`<form onsubmit="reviewOrder(event)"><div class="formsection"><h2>Contact</h2><div class="formgrid"><label>Full name<input name="name" required></label><label>Phone<input name="phone" required></label></div></div><div class="formsection"><h2>Delivery</h2><div class="formgrid"><label class="full">Full address<input name="address" required></label><label>City<input name="city" required></label><label>Landmark<input name="details"></label><label class="full">Notes<textarea name="notes"></textarea></label></div></div><button class="btn dark" style="width:100%">Review order →</button></form>`:`<div class="formsection"><span class="eye">DELIVER TO</span><h2>${E(f.name)}</h2><p>${E(f.address)}, ${E(f.city)}<br>${E(f.phone)}</p><button class="btn" onclick="ui.review=false;render()">Edit details</button><hr><span class="eye">SEND ORDER</span>${Object.values(rs.reduce((a,x)=>{(a[x.s.id]||={s:x.s,items:[]}).items.push(x);return a},{})).map(g=>`<button class="send" onclick="sendOrder('${g.s.id}')"><b class="mono">${g.s.mono}</b><span><small>SEND TO STORE</small><b>${E(g.s.name)}</b></span>→</button>`).join('')}<button class="btn dark" style="width:100%;margin-top:14px" onclick="cart=[];save();go('/order-confirmation')">I’ve sent my message →</button></div>`}</section><aside class="summary"><span class="eye">YOUR ORDER</span>${rs.map(x=>`<div class="mini"><img src="${x.c.images[0]}"><div><b>${E(x.p.name)}</b><p>${E(x.c.name)} · ${E(x.v.n)} · Qty ${x.i.qty}</p></div><b>${money(x.u*x.i.qty)}</b></div>`).join('')}<div class="line total"><span>Total</span><b>${money(sub+data.settings.delivery)}</b></div></aside></div></main>${footer()}`}

function v2setLang(l){v2lang=l;localStorage.setItem('vetra-language',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
function v2tr(x){const d=v2lang==='fr'?FR:v2lang==='ar'?AR:null;if(!d)return x;if(d[x])return d[x];let m;if((m=x.match(/^(\d+) pieces$/)))return v2lang==='fr'?m[1]+' pièces':m[1]+' قطع';if((m=x.match(/^(\d+) items from (\d+) stores$/)))return v2lang==='fr'?`${m[1]} articles de ${m[2]} boutiques`:`${m[1]} منتجات من ${m[2]} متاجر`;if((m=x.match(/^(\d+) products$/)))return v2lang==='fr'?m[1]+' produits':m[1]+' منتجات';return x}
function v2translate(){document.documentElement.lang=v2lang;document.documentElement.dir=v2lang==='ar'?'rtl':'ltr';if(v2lang==='en')return;const w=document.createTreeWalker(document.querySelector('#app'),NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{let r=n.nodeValue,t=r.trim();if(t){let z=v2tr(t);if(z!==t)n.nodeValue=r.replace(t,z)}});document.querySelectorAll('[placeholder]').forEach(e=>e.placeholder=v2tr(e.placeholder))}
function v2brand(){return `<span class="brand-lockup">${data.settings.logo?`<img src="${E(data.settings.logo)}" alt="${E(data.settings.logoAlt)}">`:''}<span class="logo brand-name">${E(data.settings.name)} <b>◆</b></span></span>`}
header=function(){let n=cart.reduce((a,x)=>a+x.qty,0);return `<div class="notice">${E(data.settings.notice)}</div><header class="header"><nav class="nav wrap"><a data-go href="/">${v2brand()}</a><div class="links"><a data-go href="/stores">Stores</a><a data-go href="/stores">Women</a><a data-go href="/stores">Men</a><a data-go href="/stores">Accessories</a><a href="/#new">New edit</a></div><div class="actions"><select class="language-select" aria-label="Language" onchange="v2setLang(this.value)"><option value="en" ${v2lang==='en'?'selected':''}>EN</option><option value="fr" ${v2lang==='fr'?'selected':''}>FR</option><option value="ar" ${v2lang==='ar'?'selected':''}>AR</option></select><button class="icon search-button" onclick="searchAll()" aria-label="Search"><span class="sr-only">Search</span></button><button class="bag" onclick="drawer()">♧ <span>Bag</span>${n?`<b class="badge">${n}</b>`:''}</button></div></nav></header>`};
const v2oldRender=render;render=function(){v2oldRender();v2translate()};addEventListener('popstate',()=>setTimeout(v2translate));
function v2img(u){return u||V2PH}function v2p(id){return data.products.find(p=>p.id===id)}function v2variants(p){return p.colors.reduce((n,c)=>n+(c.sizes?.length||0),0)}function v2done(msg){save();render();msg&&toast(msg)}
admin=function(){if(sessionStorage.getItem('admin')!=='1')return `<main class="login"><div class="login-language"><select class="language-select" onchange="v2setLang(this.value)"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select></div><div class="loginvisual"><img src="/assets/hero.webp"><b class="logo">VETRA ◆</b></div><div class="loginbox"><form onsubmit="login(event)"><span class="eye">PRIVATE ACCESS</span><h1>Welcome back.</h1><p>Manage stores, products and the market mood.</p><label>Username<input class="input" name="user"></label><br><label>Password<input class="input" type="password" name="pass"></label><p id="err" style="color:#a33"></p><button class="btn dark" style="width:100%">Enter dashboard →</button><small>Demo access: Admin / 2009</small></form></div></main>`;let t=ui.tab||'overview',tabs=[['overview','Overview'],['catalog','Catalog'],['media','Media'],['homepage','Homepage'],['orders','Orders'],['themes','Themes'],['settings','Settings']];return `<main class="admin"><aside class="sidebar"><a data-go href="/" class="logo">${E(data.settings.name)} ◆</a>${tabs.map(x=>`<button class="${t===x[0]?'on':''}" onclick="ui.tab='${x[0]}';ui.openProduct='';render()">${x[1]}</button>`).join('')}<button onclick="sessionStorage.clear();go('/0')">Sign out</button></aside><section class="adminmain"><header class="adminhead"><div><span class="eye">MARKETPLACE ADMIN</span><h1>${tabs.find(x=>x[0]===t)?.[1]}</h1></div><b>Admin · v2.1</b></header><div class="admincontent">${adminContent(t)}</div></section></main>`};
adminContent=function(t){if(t==='overview')return v2overview();if(t==='catalog')return v2catalog();if(t==='media')return v2media();if(t==='homepage')return v2homepage();if(t==='orders')return v2orders();if(t==='themes')return v2themes();return v2settings()};
function v2overview(){let pics=v2mediaEntries().length;return `<div class="adminbar"><div><span class="eye">Overview</span><h2>Everything at a glance.</h2></div><button class="btn dark" onclick="ui.tab='catalog';render()">Catalog →</button></div><div class="stats"><div class="stat"><small>Stores</small><strong>${data.stores.length}</strong></div><div class="stat"><small>Products</small><strong>${data.products.length}</strong></div><div class="stat"><small>Pictures</small><strong>${pics}</strong></div><div class="stat"><small>Variants</small><strong>${data.products.reduce((n,p)=>n+v2variants(p),0)}</strong></div></div><div class="hint"><b>Catalog hierarchy</b> · Store → Products → Product information → Pictures + Variants</div>`}
function v2catalog(){return `<div class="adminbar"><div><span class="eye">Catalog hierarchy</span><h2>Stores & products</h2></div><div class="admin-actions"><button class="btn dark" onclick="v2addStore()">+ Add store</button></div></div><div class="hint"><b>Store</b> → Products of the store → Product information → Pictures + Variants</div><div class="tree">${data.stores.map(v2storeNode).join('')}</div>`}
function v2storeNode(s){let open=ui.openStore===s.id,ps=data.products.filter(p=>p.store===s.id);return `<section class="store-node"><div class="node-top"><button class="node-main" onclick="ui.openStore=ui.openStore==='${s.id}'?'':'${s.id}';ui.openProduct='';render()"><img src="${E(v2img(s.cover))}"><span><strong>${E(s.name)}</strong><small>${E(s.city)} · ${ps.length} products</small></span><b>${open?'−':'+'}</b></button><div class="node-actions"><button class="btn" onclick="v2editStore('${s.id}')">Edit store</button><button class="btn" onclick="v2addProduct('${s.id}')">+ Add product</button><button class="btn danger" onclick="v2deleteStore('${s.id}')">Delete store</button></div></div>${open?`<div class="store-body"><div class="store-summary"><img src="${E(v2img(s.cover))}"><div><span class="eye">Store</span><p><b>${E(s.name)}</b> · ${E(s.cat)} · ${E(s.city)}</p><p>${E(s.desc)}</p><p>${E(s.phone)} · ${E(s.email)} · WhatsApp ${E(s.wa)}</p></div></div><div class="products-tree">${ps.length?ps.map(v2productNode).join(''):`<div class="empty-admin">No products in this store yet.</div>`}</div></div>`:''}</section>`}
function v2productNode(p){let open=ui.openProduct===p.id;return `<article class="product-node"><div class="product-top"><button class="product-main" onclick="ui.openProduct=ui.openProduct==='${p.id}'?'':'${p.id}';render()"><img src="${E(v2img(p.colors[0]?.images[0]))}"><span><strong>${E(p.name)}</strong><small>${p.colors.length} colors · ${v2variants(p)} variants</small></span><b>${open?'−':'+'}</b></button><div class="product-actions"><button class="btn" onclick="v2editProduct('${p.id}')">Edit product</button><button class="btn danger" onclick="v2deleteProduct('${p.id}')">Delete product</button></div></div>${open?v2productDetail(p):''}</article>`}
function v2productDetail(p){return `<div class="product-detail-admin"><div class="adminbar"><div><span class="eye">Product information</span><h3>${E(p.name)}</h3></div><div class="admin-actions"><button class="btn" onclick="v2editProduct('${p.id}')">Edit product</button><button class="btn dark" onclick="v2addColor('${p.id}')">+ Add color</button></div></div><div class="info-grid"><div class="info-tile"><small>Store</small><strong>${E(S(p.store).name)}</strong></div><div class="info-tile"><small>Price</small><strong>${money(p.sale||p.base)}</strong></div><div class="info-tile"><small>Category</small><strong>${E(p.cat)}</strong></div><div class="info-tile info-wide"><small>Description</small><strong>${E(p.desc)}</strong></div></div><div class="colors-admin">${p.colors.map((c,ci)=>v2colorPanel(p,c,ci)).join('')}</div></div>`}
function v2colorPanel(p,c,ci){return `<section class="color-panel"><div class="color-head"><i class="swatch-admin" style="background:${E(c.hex)}"></i><h4>${E(c.name)} · ${c.images.length} pictures · ${c.sizes.length} variants</h4><div class="color-actions"><button class="btn" onclick="v2editColor('${p.id}',${ci})">Edit</button><button class="btn" onclick="v2addImage('${p.id}',${ci})">+ Add picture</button><label class="btn">Upload<input hidden type="file" accept="image/*" onchange="v2uploadImage(event,'${p.id}',${ci},-1)"></label><button class="btn" onclick="v2addVariant('${p.id}',${ci})">+ Add variant</button>${p.colors.length>1?`<button class="btn danger" onclick="v2deleteColor('${p.id}',${ci})">Delete</button>`:''}</div></div><span class="eye">Pictures</span><div class="picture-grid-admin">${c.images.map((u,ii)=>v2picture(p.id,ci,ii,u)).join('')}<label class="upload-btn">＋<br>Add picture<input type="file" accept="image/*" onchange="v2uploadImage(event,'${p.id}',${ci},-1)"></label></div><span class="eye" style="display:block;margin-top:12px">Variants</span><div class="variant-wrap"><table class="variant-table"><thead><tr><th>Size</th><th>SKU</th><th>Stock</th><th>Price</th><th>Actions</th></tr></thead><tbody>${c.sizes.map((v,vi)=>`<tr><td>${E(v.n||v.name)}</td><td>${E(v.sku)}</td><td>${v.stock}</td><td>${v.price?money(v.price):'—'}</td><td><button onclick="v2editVariant('${p.id}',${ci},${vi})">Edit</button> <button class="danger" onclick="v2deleteVariant('${p.id}',${ci},${vi})">Delete</button></td></tr>`).join('')}</tbody></table></div></section>`}
function v2picture(pid,ci,ii,u){return `<article class="picture-card"><img src="${E(v2img(u))}"><div class="picture-copy"><small>${E(u.split('/').pop()||'Image')}</small><div class="picture-actions"><button onclick="v2replaceImage('${pid}',${ci},${ii})">Replace</button><label>Upload<input type="file" accept="image/*" onchange="v2uploadImage(event,'${pid}',${ci},${ii})"></label><button class="danger" onclick="v2deleteImage('${pid}',${ci},${ii})">Delete</button></div></div></article>`}
function v2mediaEntries(){let a=[{key:'hero',url:data.settings.heroImage,label:'Homepage hero',group:'Main page'},{key:'logo',url:data.settings.logo||V2PH,label:'Website logo',group:'Main page'}];data.stores.forEach(s=>{a.push({key:`cover|${s.id}`,url:v2img(s.cover),label:s.name,group:'Store cover'});a.push({key:`storelogo|${s.id}`,url:v2img(s.logo),label:s.name,group:'Store logo'})});data.products.forEach(p=>p.colors.forEach((c,ci)=>c.images.forEach((u,ii)=>a.push({key:`product|${p.id}|${ci}|${ii}`,url:v2img(u),label:`${p.name} · ${c.name}`,group:'Product picture'}))));return a}
function v2media(){let a=v2mediaEntries();return `<div class="adminbar"><div><span class="eye">Media</span><h2>All website pictures</h2></div><div class="admin-actions"><button class="btn" onclick="ui.tab='homepage';render()">Main page</button><button class="btn dark" onclick="ui.tab='catalog';render()">Products</button></div></div><div class="media-tools"><input class="input" placeholder="Search pictures" oninput="v2filterMedia(this.value)"><span>${a.length} pictures</span></div><div class="media-grid-admin">${a.map(v2mediaCard).join('')}</div>`}
function v2mediaCard(x){return `<article class="media-card" data-search="${E((x.label+' '+x.group).toLowerCase())}"><img src="${E(x.url)}"><div class="media-copy"><h4>${E(x.label)}</h4><p>${E(x.group)}</p><div class="media-actions"><button onclick="v2replaceMedia('${x.key}')">Replace</button><label>Upload<input type="file" accept="image/*" onchange="v2uploadMedia(event,'${x.key}')"></label><button class="danger" onclick="v2deleteMedia('${x.key}')">Delete</button></div></div></article>`}
function v2filterMedia(q){document.querySelectorAll('[data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q.toLowerCase())?'':'none')}
function v2homepage(){return `<div class="adminbar"><div><span class="eye">Homepage</span><h2>Homepage editor</h2></div></div><div class="home-editor"><form class="adminform" onsubmit="v2saveHome(event)"><h2>Main page</h2><label class="full">Announcement<input name="notice" value="${E(data.settings.notice)}"></label><label class="full">Hero headline<textarea name="title">${E(data.settings.heroTitle)}</textarea></label><label class="full">Hero introduction<textarea name="text">${E(data.settings.heroText)}</textarea></label><label class="full">Hero image URL<input name="hero" value="${E(data.settings.heroImage)}"></label><div class="formactions"><label class="btn">Upload<input hidden type="file" accept="image/*" onchange="v2uploadMedia(event,'hero')"></label><button type="button" class="btn danger" onclick="v2deleteMedia('hero')">Delete</button><button class="btn dark">Save homepage</button></div></form><aside class="home-preview"><img src="${E(v2img(data.settings.heroImage))}"><div><span class="eye">Main page</span><h3>${E(data.settings.heroTitle)}</h3><p>${E(data.settings.heroText)}</p></div></aside></div>`}
function v2orders(){return `<div class="adminbar"><div><span class="eye">Orders</span><h2>${data.orders.length?data.orders.length+' orders':'No orders yet'}</h2></div></div>${data.orders.length?`<div class="manage">${data.orders.map(o=>`<div class="row"><b>${E(o.id)}</b><span>${E(o.name)}</span><span>${money(o.total)}</span><span>WhatsApp Pending</span></div>`).join('')}</div>`:`<div class="empty-admin">No orders yet</div>`}`}
function v2themes(){return `<div class="adminbar"><div><span class="eye">Themes</span><h2>Nine theme moods</h2></div></div><div class="themegrid">${themes.map(x=>`<button class="theme ${data.settings.theme===x.id?'on':''}" onclick="data.settings.theme=${x.id};v2done('${E(x.name)}')"><div class="palette">${[x.p,x.a,x.bg,x.card,x.ink].map(c=>`<i style="background:${c}"></i>`).join('')}</div><h3>${E(x.name)}</h3></button>`).join('')}</div>`}
function v2settings(){return `<div class="adminbar"><div><span class="eye">Settings</span><h2>Website identity</h2></div></div><form class="adminform" onsubmit="v2saveSettings(event)"><h2>Website identity</h2><label>Website name<input name="name" value="${E(data.settings.name)}"></label><label>Logo URL<input name="logo" value="${E(data.settings.logo)}"></label><label class="full">Logo alternative text<input name="alt" value="${E(data.settings.logoAlt)}"></label><div class="brand-preview full">${data.settings.logo?`<img src="${E(data.settings.logo)}">`:`<b class="mono">◆</b>`}<div><small>Website identity</small><h3>${E(data.settings.name)}</h3></div></div><label>Currency<input name="currency" value="${E(data.settings.currency)}"></label><label>Main WhatsApp<input name="wa" value="${E(data.settings.mainWa)}"></label><label>Delivery fee<input type="number" name="delivery" value="${data.settings.delivery}"></label><label>Language<select name="language"><option value="en" ${v2lang==='en'?'selected':''}>English</option><option value="fr" ${v2lang==='fr'?'selected':''}>Français</option><option value="ar" ${v2lang==='ar'?'selected':''}>العربية</option></select></label><div class="formactions"><label class="btn">Upload logo<input hidden type="file" accept="image/*" onchange="v2uploadMedia(event,'logo')"></label><button type="button" class="btn danger" onclick="v2deleteMedia('logo')">Delete logo</button><button class="btn dark">Save identity</button></div></form>`}
function v2read(e,cb){let f=e.target.files?.[0];if(!f)return;if(f.size>3500000)return toast('Image must be below 3.5 MB');let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function v2target(key){let a=key.split('|');if(key==='hero')return{get:()=>data.settings.heroImage,set:v=>data.settings.heroImage=v};if(key==='logo')return{get:()=>data.settings.logo,set:v=>data.settings.logo=v};if(a[0]==='cover'){let s=S(a[1]);return{get:()=>s.cover,set:v=>s.cover=v}}if(a[0]==='storelogo'){let s=S(a[1]);return{get:()=>s.logo,set:v=>s.logo=v}}if(a[0]==='product'){let c=v2p(a[1]).colors[+a[2]],i=+a[3];return{get:()=>c.images[i],set:v=>c.images[i]=v,del:()=>c.images.length>1?c.images.splice(i,1):c.images[0]=V2PH}}}
function v2replaceMedia(k){let t=v2target(k),u=prompt('New image URL',t.get()||'');if(u){t.set(u);v2done('Picture replaced')}}function v2uploadMedia(e,k){v2read(e,u=>{v2target(k).set(u);v2done('Picture uploaded')})}function v2deleteMedia(k){if(!confirm('Delete this picture?'))return;let t=v2target(k);t.del?t.del():t.set(k==='hero'?V2PH:'');v2done('Picture deleted')}
function v2addImage(id,ci){let u=prompt('Image URL');if(u){v2p(id).colors[ci].images.push(u);v2done('Picture added')}}function v2replaceImage(id,ci,ii){let c=v2p(id).colors[ci],u=prompt('New image URL',c.images[ii]);if(u){c.images[ii]=u;v2done('Picture replaced')}}function v2uploadImage(e,id,ci,ii){v2read(e,u=>{let a=v2p(id).colors[ci].images;ii<0?a.push(u):a[ii]=u;v2done('Picture uploaded')})}function v2deleteImage(id,ci,ii){if(confirm('Delete this picture?')){let a=v2p(id).colors[ci].images;a.length>1?a.splice(ii,1):a[0]=V2PH;v2done('Picture deleted')}}
function v2addStore(){let n=prompt('Store name');if(!n)return;let id='s'+Date.now();data.stores.push({id,slug:n.toLowerCase().replace(/\W+/g,'-'),name:n,mono:n.slice(0,2).toUpperCase(),cat:prompt('Category','Fashion')||'Fashion',city:prompt('City','Morocco')||'Morocco',rating:5,desc:prompt('Description','New store')||'',cover:'/assets/hero.webp',logo:'',phone:'',wa:data.settings.mainWa,email:'',address:'',hours:'Mon–Sat'});ui.openStore=id;v2done('Store added')}
function v2editStore(id){let s=S(id),n=prompt('Store name',s.name);if(n===null)return;s.name=n||s.name;s.cat=prompt('Category',s.cat)||s.cat;s.city=prompt('City',s.city)||s.city;s.desc=prompt('Description',s.desc)||s.desc;s.wa=prompt('WhatsApp',s.wa)||s.wa;v2done('Store updated')}function v2deleteStore(id){if(confirm('Delete store and its products?')){data.stores=data.stores.filter(s=>s.id!==id);data.products=data.products.filter(p=>p.store!==id);ui.openStore=data.stores[0]?.id;v2done('Store deleted')}}
function v2addProduct(sid){let n=prompt('Product name');if(!n)return;let id='p'+Date.now();data.products.push({id,slug:n.toLowerCase().replace(/\W+/g,'-'),store:sid,name:n,cat:prompt('Category','Fashion')||'Fashion',desc:prompt('Description','New product')||'',base:+(prompt('Price','500')||500),featured:true,new:true,colors:[{name:'Default',hex:'#333',images:['/assets/blazer-black.webp'],sizes:[{n:'One size',sku:'SKU-'+Date.now(),stock:1}]}]});ui.openProduct=id;v2done('Product added')}function v2editProduct(id){let p=v2p(id),n=prompt('Product name',p.name);if(n===null)return;p.name=n||p.name;p.cat=prompt('Category',p.cat)||p.cat;p.desc=prompt('Description',p.desc)||p.desc;p.base=+(prompt('Price',p.base)||p.base);v2done('Product updated')}function v2deleteProduct(id){if(confirm('Delete this product?')){data.products=data.products.filter(p=>p.id!==id);ui.openProduct='';v2done('Product deleted')}}
function v2addColor(id){let p=v2p(id),n=prompt('Color name','New color');if(n){p.colors.push({name:n,hex:prompt('Hex color','#777')||'#777',images:[V2PH],sizes:[{n:'One size',sku:'SKU-'+Date.now(),stock:1}]});v2done('Color added')}}function v2editColor(id,ci){let c=v2p(id).colors[ci];c.name=prompt('Color name',c.name)||c.name;c.hex=prompt('Hex color',c.hex)||c.hex;v2done('Color updated')}function v2deleteColor(id,ci){let p=v2p(id);if(p.colors.length>1&&confirm('Delete this color?')){p.colors.splice(ci,1);v2done('Color deleted')}}
function v2addVariant(id,ci){let c=v2p(id).colors[ci],n=prompt('Size / variant','M');if(n){c.sizes.push({n,sku:prompt('SKU','SKU-'+Date.now()),stock:+(prompt('Stock','1')||0),price:+(prompt('Price override','0')||0)||undefined});v2done('Variant added')}}function v2editVariant(id,ci,vi){let v=v2p(id).colors[ci].sizes[vi];v.n=prompt('Size / variant',v.n||v.name)||v.n;v.sku=prompt('SKU',v.sku)||v.sku;v.stock=+(prompt('Stock',v.stock)||0);let p=+(prompt('Price override',v.price||0)||0);p?v.price=p:delete v.price;v2done('Variant updated')}function v2deleteVariant(id,ci,vi){let a=v2p(id).colors[ci].sizes;if(a.length>1&&confirm('Delete variant?')){a.splice(vi,1);v2done('Variant deleted')}}
function v2saveHome(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{notice:f.notice,heroTitle:f.title,heroText:f.text,heroImage:f.hero||V2PH});v2done('Homepage saved')}function v2saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{name:f.name||data.settings.name,logo:f.logo||'',logoAlt:f.alt||f.name,currency:f.currency,mainWa:(f.wa||'').replace(/\D/g,''),delivery:+f.delivery});v2lang=f.language;localStorage.setItem('vetra-language',v2lang);v2done('Settings saved')}
const v2oldHome=home;home=function(){let h=v2oldHome();return data.settings.heroImage&&data.settings.heroImage!=='/assets/hero.webp'?h.replace('src="/assets/hero.webp"','src="'+E(data.settings.heroImage)+'"'):h};
render();

</script></body></html>
