</script><script id="vetra-v41-app">
/* VETRA 4.1 — IndexedDB persistence, instant preview and live cross-tab sync */
const V41_VERSION='4.1.0',V41_DB='vetra-content-db',V41_STORE='state',V41_KEY='site',V41_CHANNEL='vetra-live-content-v1';
const v41TabId=crypto.randomUUID?.()||String(Date.now())+Math.random();
let v41State='saved',v41LastSaved=0,v41WriteQueue=Promise.resolve(),v41Loading=false;
const v41Channel='BroadcastChannel'in window?new BroadcastChannel(V41_CHANNEL):null;
function v41OpenDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(V41_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(V41_STORE))r.result.createObjectStore(V41_STORE,{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('Unable to open local content database'))})}
async function v41Read(){const db=await v41OpenDB();return new Promise((resolve,reject)=>{const tx=db.transaction(V41_STORE,'readonly'),r=tx.objectStore(V41_STORE).get(V41_KEY);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function v41Write(snapshot,updatedAt){const db=await v41OpenDB();return new Promise((resolve,reject)=>{const tx=db.transaction(V41_STORE,'readwrite');tx.objectStore(V41_STORE).put({key:V41_KEY,data:snapshot,updatedAt,version:V41_VERSION});tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||Error('Unable to save changes'))};tx.onabort=()=>{db.close();reject(tx.error||Error('Save was interrupted'))}})}
function v41Compact(snapshot){return JSON.stringify(snapshot,(k,v)=>typeof v==='string'&&v.startsWith('data:')?V2PH:v)}
function v41SetState(state,message=''){v41State=state;document.querySelectorAll('.v41-save-state').forEach(el=>{el.className=`v41-save-state ${state}`;el.textContent=state==='saving'?'Saving…':state==='error'?'Not saved':'Saved'});if(message)v41Toast(message,state==='error')}
function v41Toast(message,isError=false){let el=document.querySelector('#v41SaveToast');if(!el){el=document.createElement('div');el.id='v41SaveToast';el.className='v41-save-toast';document.body.appendChild(el)}el.textContent=message;el.className=`v41-save-toast ${isError?'error ':''}show`;clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2200)}
function v41Persist(snapshot){const updatedAt=Date.now();v41WriteQueue=v41WriteQueue.catch(()=>{}).then(()=>v41Write(snapshot,updatedAt)).then(()=>{v41LastSaved=updatedAt;localStorage.setItem('vetra-content-updated',String(updatedAt));v41Channel?.postMessage({type:'content-updated',updatedAt,source:v41TabId});v41SetState('saved');}).catch(e=>{console.error(e);v41SetState('error','Changes could not be saved. Please try again.')});return v41WriteQueue}
const v41LegacySave=save;
save=function(){const snapshot=structuredClone(data);v41SetState('saving');try{localStorage.setItem('vetra-cart',JSON.stringify(cart));const full=JSON.stringify(snapshot);localStorage.setItem('vetra-data',full.length<3000000?full:v41Compact(snapshot))}catch{try{localStorage.setItem('vetra-data',v41Compact(snapshot))}catch{}}v41Persist(snapshot)};
v4SafeSave=function(){save();return true};
v4VideoData=function(file){return new Promise(resolve=>{if(file.size>15000000){toast('Video must be below 15 MB');return resolve('')}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>{toast('Unable to read video');resolve('')};r.readAsDataURL(file)})};
function v41Migrate(){data.stores?.forEach((s,i)=>{s.hidden??=false;s.createdAt??=new Date(Date.now()-(i+10)*86400000).toISOString();s.logo??=s.cover;s.instagram??='';s.facebook??='';s.website??=''});data.products?.forEach((p,i)=>{p.hidden??=false;p.createdAt??=new Date(Date.now()-(i+6)*86400000).toISOString();if(!Array.isArray(p.media)||!p.media.length){const urls=[...new Set((p.colors||[]).flatMap(c=>c.images||[]))].slice(0,10);p.media=urls.map((url,n)=>({id:`${p.id}-media-${n}`,type:'image',url,name:url.split('/').pop()||`Image ${n+1}`}))}});data.orders??=[];data.homeBlocks??=[]}
async function v41LoadLatest(force=false){if(v41Loading)return;v41Loading=true;try{const row=await v41Read();if(row?.data&&(force||row.updatedAt>v41LastSaved)){data=structuredClone(row.data);v41LastSaved=row.updatedAt||Date.now();v41Migrate();theme();render();v41SetState('saved')}}catch(e){console.warn('Content restore skipped',e)}finally{v41Loading=false}}
async function v41Boot(){try{const row=await v41Read();if(row?.data){data=structuredClone(row.data);v41LastSaved=row.updatedAt||Date.now();v41Migrate();theme();render();v41SetState('saved')}else{v41Migrate();save();render()}}catch(e){console.warn(e);v41Migrate();render();v41SetState('error','Advanced storage is unavailable; changes use browser fallback.')}}
v41Channel&&(v41Channel.onmessage=e=>{if(e.data?.type==='content-updated'&&e.data.source!==v41TabId)v41LoadLatest(true)});
addEventListener('storage',e=>{if(e.key==='vetra-content-updated'&&Number(e.newValue)>v41LastSaved)v41LoadLatest(true)});
addEventListener('focus',()=>{const t=Number(localStorage.getItem('vetra-content-updated')||0);if(t>v41LastSaved)v41LoadLatest(true)});
addEventListener('beforeunload',e=>{if(v41State==='saving'){e.preventDefault();e.returnValue=''}});
const v41BaseAdmin=admin;
admin=function(){let html=v41BaseAdmin();if(sessionStorage.getItem('admin')!=='1')return html;const status=`<div class="v41-admin-status"><span class="v41-save-state ${v41State}">${v41State==='saving'?'Saving…':v41State==='error'?'Not saved':'Saved'}</span><b class="v41-admin-version">Admin · v${V41_VERSION}</b></div>`;html=html.replace(/<b>Admin · v4\.0\.0<\/b>/,status);return html.replace('<div class="admincontent">','<div class="admincontent"><div class="v41-live-note">Saved changes appear immediately here and in other open storefront tabs.</div>')};
const v41BaseApplyMeta=v3ApplyMeta;
v3ApplyMeta=function(){v41BaseApplyMeta();document.body.dataset.vetraVersion=V41_VERSION};
v41Boot();

</script><script id="vetra-v42-app">
/* VETRA 4.2 — publish safe storefront content and media across devices */
const V42_VERSION='4.2.1';
let v42CloudState='local',v42CloudUpdatedAt=0,v42PublishTimer=0,v42Publishing=false,v42Pulling=false;
const v42Uploaded=new Map();
function v42Key(){return sessionStorage.getItem('vetra-publish-key')||localStorage.getItem('vetra-publish-key')||''}
function v42SetCloudState(state,message=''){v42CloudState=state;document.querySelectorAll('.v42-cloud-state').forEach(el=>{el.className=`v42-cloud-state ${state}`;el.textContent=state==='publishing'?'Publishing…':state==='published'?'Published':state==='error'?'Publish failed':'Local only'});if(message)v41Toast(message,state==='error')}
function v42PublicSnapshot(){const s=data.settings||{},safeSettings={name:s.name,currency:s.currency,mainWa:s.mainWa,delivery:s.delivery,heroTitle:s.heroTitle,heroText:s.heroText,notice:s.notice,theme:s.theme,logo:s.logo,logoAlt:s.logoAlt,heroImage:s.heroImage,seoTitle:s.seoTitle,seoDescription:s.seoDescription};return{version:V42_VERSION,settings:safeSettings,stores:structuredClone(data.stores||[]),products:structuredClone(data.products||[]),homeBlocks:structuredClone(data.homeBlocks||[]),categories:structuredClone(data.categories||[])}}
function v42ApplyPublic(content){if(!content||typeof content!=='object')return;if(content.settings)Object.assign(data.settings,content.settings);for(const key of ['stores','products','homeBlocks','categories'])if(Array.isArray(content[key]))data[key]=structuredClone(content[key]);v41Migrate();theme();render()}
async function v42Request(url,options={}){const r=await fetch(url,{cache:'no-store',...options});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}
async function v42PullLatest(force=false){if(v42Pulling||v42Publishing)return;v42Pulling=true;try{const j=await v42Request('/api/content');const t=Date.parse(j.updatedAt||0)||0;if(j.data&&(force||t>v42CloudUpdatedAt)){v42CloudUpdatedAt=t;v42ApplyPublic(j.data);v42BaseSave();v42SetCloudState(v42Key()?'published':'local')}}catch(e){if(!/no content/i.test(e.message)&&sessionStorage.getItem('admin')==='1'&&v42Key())v42SetCloudState('error',e.message)}finally{v42Pulling=false}}
async function v42UploadDataUrl(value,key){if(v42Uploaded.has(value))return v42Uploaded.get(value);const j=await v42Request('/api/media',{method:'POST',headers:{'Content-Type':'application/json','X-Content-Admin-Key':key},body:JSON.stringify({dataUrl:value})});v42Uploaded.set(value,j.url);return j.url}
async function v42Cloudify(node,key){if(typeof node==='string'&&/^data:(image|video)\//i.test(node)){if(!/^data:[^,]+;base64,/i.test(node))return node;try{return await v42UploadDataUrl(node,key)}catch(e){if(/Invalid image or video/i.test(e.message))return node;throw e}}if(Array.isArray(node)){for(let i=0;i<node.length;i++)node[i]=await v42Cloudify(node[i],key);return node}if(node&&typeof node==='object'){for(const k of Object.keys(node))node[k]=await v42Cloudify(node[k],key);return node}return node}
function v42ReplaceLive(node,replacements){if(!node||typeof node!=='object')return;for(const k of Object.keys(node)){const v=node[k];if(typeof v==='string'&&replacements.has(v))node[k]=replacements.get(v);else if(v&&typeof v==='object')v42ReplaceLive(v,replacements)}}
async function v42PublishNow(showToast=true){const key=v42Key();if(!key){v42SetCloudState('local');if(showToast)v41Toast('Connect cloud publishing first.',true);return false}if(v42Publishing)return false;v42Publishing=true;clearTimeout(v42PublishTimer);v42SetCloudState('publishing');try{v42Uploaded.clear();let content=v42PublicSnapshot();content=await v42Cloudify(content,key);const replacements=new Map(v42Uploaded);if(replacements.size){v42ReplaceLive(data,replacements);v42BaseSave();render()}const j=await v42Request('/api/content',{method:'PUT',headers:{'Content-Type':'application/json','X-Content-Admin-Key':key},body:JSON.stringify({data:content})});v42CloudUpdatedAt=Date.parse(j.updatedAt||new Date().toISOString());v42SetCloudState('published',showToast?'Published to every device.':'');return true}catch(e){v42SetCloudState('error',e.message);return false}finally{v42Publishing=false}}
function v42SchedulePublish(){if(!v42Key()){v42SetCloudState('local');return}clearTimeout(v42PublishTimer);v42PublishTimer=setTimeout(()=>v42PublishNow(false),650)}
function v42ConnectPublishing(){const current=v42Key(),key=prompt('Enter the CONTENT_ADMIN_KEY from Vercel:',current);if(!key)return;sessionStorage.setItem('vetra-publish-key',key);if(confirm('Remember this publishing key on this device?'))localStorage.setItem('vetra-publish-key',key);v42SetCloudState('publishing');v42PublishNow(true)}
function v42DisconnectPublishing(){sessionStorage.removeItem('vetra-publish-key');localStorage.removeItem('vetra-publish-key');v42SetCloudState('local');render();v41Toast('Cloud publishing disconnected on this device.')}
const v42BaseSave=save;
save=function(){v42BaseSave();if(sessionStorage.getItem('admin')==='1')v42SchedulePublish()};
v4SafeSave=function(){save();return true};
v4VideoData=function(file){return new Promise(resolve=>{if(file.size>2200000){toast('For cross-device publishing, video must be below 2 MB');return resolve('')}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>{toast('Unable to read video');resolve('')};r.readAsDataURL(file)})};
const v42BaseAdmin=admin;
admin=function(){let html=v42BaseAdmin();if(sessionStorage.getItem('admin')!=='1')return html;const cloud=`<span class="v42-cloud-state ${v42CloudState}">${v42CloudState==='publishing'?'Publishing…':v42CloudState==='published'?'Published':v42CloudState==='error'?'Publish failed':'Local only'}</span>`;html=html.replace('<b class="v41-admin-version">Admin · v4.1.0</b>',`${cloud}<b class="v41-admin-version">Admin · v${V42_VERSION}</b>`);const connected=!!v42Key(),note=`<div class="v42-cloud-note ${connected?'connected':''}"><div><strong>${connected?'Cross-device publishing connected':'Cross-device publishing is not connected'}</strong><span>${connected?'Every saved storefront edit is published automatically to phones, computers and other devices.':'Local saves stay on this device. Connect once, then every Save publishes automatically.'}</span></div><div class="v42-cloud-actions"><button class="dark" onclick="${connected?'v42PublishNow(true)':'v42ConnectPublishing()'}">${connected?'Publish now':'Connect publishing'}</button>${connected?'<button onclick="v42DisconnectPublishing()">Disconnect</button>':''}</div></div>`;html=html.replace(/<div class="v41-live-note">[\s\S]*?<\/div>/,note);return html};
