<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MKS Shop — Seller</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#222;font:16px/1.5 Arial,sans-serif}.shell{max-width:960px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.brand{font-weight:800;letter-spacing:.1em;font-size:20px}h1{font-size:30px;margin:0 0 8px}h2{font-size:22px;margin:0 0 16px}p{color:#67645e}.card{background:white;border:1px solid #dedcd6;border-radius:12px;padding:24px;margin:20px 0}.login{max-width:450px;margin:8vh auto}label{display:grid;gap:8px;margin:16px 0}input,button,select{font:inherit;border:1px solid #cbc8c0;border-radius:8px;padding:11px 14px;min-height:46px}input{width:100%;direction:auto}button{cursor:pointer;background:#fff;color:#222}.primary{background:#222;color:#fff;border-color:#222}button:disabled{opacity:.6;cursor:wait}.product{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:end;gap:16px;padding:16px 0;border-bottom:1px solid #eee}.product:last-child{border:0}.product img{width:64px;height:76px;object-fit:cover;border-radius:8px}.product label{margin:0}.logo{width:120px;height:120px;object-fit:contain;border:1px solid #eee;border-radius:12px}.status{min-height:24px;color:#31704b}.error{color:#b52b27}a{color:inherit}.muted{font-size:14px;color:#67645e}#lang{max-width:130px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2783de;outline-offset:3px}@media(max-width:600px){.shell{padding:20px 16px}.card{padding:18px}.product{grid-template-columns:50px minmax(0,1fr);gap:12px}.product img{width:50px;height:62px}.product button{grid-column:2}header{flex-wrap:wrap}h1{font-size:26px}}</style></head><body><div class="shell"><header><a class="brand" href="/">MKS SHOP</a><select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option></select></header><main id="app"></main><p id="status" class="status" role="status" aria-live="polite"></p></div><script>
let current=null,lang=localStorage.getItem('mks-seller-language')||'ar';
const t=(ar,en)=>lang==='ar'?ar:en;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,values,method='POST'){const r=await fetch('/api/sellers'+(method==='GET'?'?action='+action:''),{method,credentials:'same-origin',cache:'no-store',headers:method==='POST'?{'Content-Type':'application/json'}:{},...(method==='POST'?{body:JSON.stringify({action,...values})}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function status(text,error=false){const el=document.querySelector('#status');el.textContent=text;el.className='status'+(error?' error':'')}
function draw(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelector('#lang').value=lang;document.querySelector('#app').innerHTML=current?`<h1>${esc(current.store.name)}</h1><p>${t('لوحة البائع — يمكنك تعديل شعار متجرك وأسماء منتجاتك فقط.','Seller dashboard — edit only your store logo and product names.')}</p><button id="logout">${t('تسجيل الخروج','Sign out')}</button><section class="card"><h2>${t('شعار المتجر','Store logo')}</h2><img class="logo" src="${esc(current.store.logo||'')}" alt="${esc(current.store.name)}"><label>${t('اختر شعاراً — PNG أو JPEG أو WebP، أقل من 2 ميجابايت','Choose a logo — PNG, JPEG or WebP, below 2 MB')}<input type="file" id="logo" accept="image/png,image/jpeg,image/webp"></label><button class="primary" id="upload">${t('حفظ ونشر الشعار','Save & publish logo')}</button></section><section class="card"><h2>${t('منتجات متجرك','Your products')}</h2>${current.products.map(p=>`<form class="product" data-id="${esc(p.id)}"><img src="${esc(p.image)}" alt=""><label>${t('اسم المنتج','Product name')}<input name="name" value="${esc(p.name)}" required maxlength="160"></label><button class="primary">${t('حفظ ونشر','Save & publish')}</button></form>`).join('')||`<p>${t('لا توجد منتجات. تواصل مع المدير لإضافة منتج.','No products yet. Contact the administrator to add products.')}</p>`}</section>`:`<section class="card login"><h1>${t('دخول البائع','Seller sign in')}</h1><p>${t('استخدم بيانات الدخول التي أعطاك إياها مدير الموقع.','Use the credentials provided by the website administrator.')}</p><form id="login"><label>${t('اسم المستخدم','Username')}<input name="user" autocomplete="username" required></label><label>${t('كلمة المرور','Password')}<input name="pass" type="password" autocomplete="current-password" required></label><button class="primary">${t('دخول لوحة البائع','Open seller dashboard')}</button></form></section>`;
 document.querySelector('#login')?.addEventListener('submit',async e=>{e.preventDefault();await busy(e.target,async()=>{current=await api('login',Object.fromEntries(new FormData(e.target)));draw();status('')})});
 document.querySelector('#logout')?.addEventListener('click',async()=>{await api('logout');current=null;draw();status('')});
 document.querySelectorAll('.product').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();await busy(f,async()=>{await api('product-name',{productId:f.dataset.id,name:f.elements.name.value});current.products.find(p=>p.id===f.dataset.id).name=f.elements.name.value;status(t('تم الحفظ والنشر لجميع الأجهزة','Saved and published to all devices'))})}));
 document.querySelector('#upload')?.addEventListener('click',async e=>{await busy(e.target.parentElement,async()=>{const file=document.querySelector('#logo').files[0];if(!file)throw Error(t('اختر صورة أولاً','Choose an image first'));if(file.size>2000000)throw Error('Maximum 2 MB');const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const j=await api('logo',{dataUrl});current.store.logo=j.logo;draw();status(t('تم حفظ ونشر الشعار','Logo saved and published'))})});
}
async function busy(el,fn){const buttons=[...el.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);status(t('جاري الحفظ…','Please wait…'));try{await fn()}catch(e){status(e.message,true)}finally{buttons.forEach(b=>b.disabled=false)}}
document.querySelector('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('mks-seller-language',lang);draw()};draw();api('me',null,'GET').then(j=>{current=j;draw()}).catch(()=>{});
</script></body></html>
