function header(){let n=cart.reduce((a,x)=>a+x.qty,0);return `<div class="notice">${E(data.settings.notice)}</div><header class="header"><nav class="nav wrap"><a data-go class="logo" href="/">${E(data.settings.name)} <b>◆</b></a><div class="links"><a data-go href="/stores">Stores</a><a data-go href="/stores">Women</a><a data-go href="/stores">Men</a><a data-go href="/stores">Accessories</a><a href="/#new">New edit</a></div><div class="actions"><button class="icon" onclick="searchAll()">⌕</button><button class="bag" onclick="drawer()">♧ Bag ${n?`<b class="badge">${n}</b>`:''}</button></div></nav></header>`}function footer(){return `<footer class="footer"><div class="foot wrap"><div><b class="logo">VETRA ◆</b><p>A curated marketplace for independent fashion stores across Morocco.</p></div><div><h4>DISCOVER</h4><a data-go href="/stores">All stores</a><a>New arrivals</a><a>Sale edit</a></div><div><h4>SERVICE</h4><a>Contact</a><a>Delivery & returns</a><a>Privacy</a></div><div><h4>A BETTER INBOX</h4><p>Store launches, edits and private offers—occasionally.</p><input class="input" placeholder="Email address"></div></div><div class="copy wrap"><span>© 2026 VETRA</span><span>INDEPENDENT FASHION</span></div></footer>`}function heading(eye,title,text='',link=''){return `<div class="head"><div><span class="eye">${eye}</span><h2>${title}</h2>${text?`<p>${text}</p>`:''}</div>${link?`<a data-go href="${link}">View all →</a>`:''}</div>`}function storeCard(s){return `<a data-go href="/store/${s.slug}" class="store-card"><div class="photo"><img src="${s.cover}"></div><div class="store-meta"><b class="mono">${s.mono}</b><div><small>${E(s.cat)} · ${E(s.city)}</small><h3>${E(s.name)}</h3></div><span>★ ${s.rating}</span></div></a>`}function productCard(p){return `<article class="product-card"><a data-go href="/product/${p.slug}" class="photo"><img src="${img(p)}">${p.new?'<b class="tag">NEW</b>':''}${p.sale?'<b class="tag sale">SALE</b>':''}</a><div class="pcopy"><small>${E(S(p.store).na function cartRows(){return cart.map(i=>{let p=data.products.find(x=>x.id===i.product),s=S(p.store),c=p.colors.find(x=>x.name===i.color),v=c.sizes.find(x=>x.n===i.size);return{i,p,s,c,v,u:v.price||p.sale||p.base}})}function drawer(){let rs=cartRows(),sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0);document.querySelector('#overlay').innerHTML=`<div class="drawerback" onclick="closeDrawer()"></div><aside class="drawer"><div class="drawer-head"><h2>Shopping bag</h2><button class="icon" onclick="closeDrawer()">×</button></div><div class="drawer-body">${rs.length?rs.map(x=>`<div class="mini"><img src="${x.c.images[0]}"><div><small>${E(x.s.name)}</small><b>${E(x.p.name)}</b><p>${E(x.c.name)} · ${E(x.v.n)}</p><div class="qty"><button onclick="cartQty('${x.i.uid}',-1)">−</button><span>${x.i.qty}</span><button onclick="cartQty('${x.i.uid}',1)">+</button></div></div><button class="icon" onclick="removeCart('${x.i.uid}')">×</button></div>`).join(''):'<div class="empty"><h2>Your bag is empty</h2></div>'}</div>${rs.length?`<div class="drawer-foot"><div class="line"><span>Subtotal</span><b>${money(sub)}</b></div><a data-go class="btn dark" style="width:100%" href="/checkout">Checkout →</a></div>`:''}</aside>`;links()}function closeDrawer(){document.querySelector('#overlay').innerHTML=''}
function cartPage(){let rs=cartRows(),groups=Object.values(rs.reduce((a,x)=>{(a[x.s.id]||={s:x.s,items:[]}).items.push(x);return a},{})),sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0),del=rs.length?data.settings.delivery:0;return `${header()}<main class="page wrap"><div class="title"><span class="eye">YOUR SELECTION</span><h1>Shopping bag</h1><p>${cart.reduce((n,x)=>n+x.qty,0)} items from ${groups.length} stores</p></div>${rs.length?`<div class="cart-layout"><section>${groups.map(g=>`<div class="cartgroup"><h3>${E(g.s.name)}</h3>${g.items.map(x=>`<div class="cartitem"><img src="${x.c.images[0]}"><div><small>${E(x.s.name)}</small><h3>${E(x.p.name)}</h3><p>${E(x.c.name)} · ${E(x.v.n)} · ${x.v.sku}</p><div class="qty"><button onclick="cartQty('${x.i.uid}',-1)">−</button><span>${x.i.qty}</span><button onclick="cartQty('${x.i.uid}',1)">+</button></div><button class="icon" onclick="removeCart('${x.i.uid}')">⌫</button></div><b>${money(x.u*x.i.qty)}</b></div>`).join('')}</div>`).join('')}</section><aside class="summary"><span class="eye">ORDER SUMMARY</span><h2>The total</h2><div class="line"><span>Subtotal</span><b>${money(sub)}</b></div><div class="line"><span>Delivery</span><b>${money(del)}</b></div><div class="line total"><span>Total</span><b>${money(sub+del)}</b></div><a data-go class="btn dark" style="width:100%;margin-top:15px" href="/checkout">Continue to checkout →</a></aside></div>`:'<div class="empty"><h2>Your bag is empty</h2><a data-go class="btn dark" href="/stores">Browse stores →</a></div>'}</main>${footer()}`}
function checkout(){let rs=cartRows();if(!rs.length)return empty();let sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0),f=ui.form||{};return `${header()}<main class="page wrap"><div class="title"><span class="eye">WHATSAPP CHECKOUT</span><h1>${ui.review?'Review & send':'Where should it go?'}</h1><p>We format every product detail into a clear WhatsApp request.</p></div><div class="checkout-layout"><section>${!ui.review?`<form onsubmit="reviewOrder(event)"><div class="formsection"><h2>Contact</h2><div class="formgrid"><label>Full name<input name="name" required></label><label>Phone<input name="phone" required></label></div></div><div class="formsection"><h2>Delivery</h2><div class="formgrid"><label class="full">Full address<input name="address" required></label><label>City<input name="city" required></label><label>Landmark<input name="details"></label><label class="full">Notes<textarea name="notes"></textarea></label></div></div><button class="btn dark" style="width:100%">Review order →</button></form>`:`<div class="formsection"><span class="eye">DELIVER TO</span><h2>${E(f.name)}</h2><p>${E(f.address)}, ${E(f.city)}<br>${E(f.phone)}</p><button class="btn" onclick="ui.review=false;render()">Edit details</button><hr><span class="eye">SEND ORDER</span>${Object.values(rs.reduce((a,x)=>{(a[x.s.id]||={s:x.s,items:[]}).items.push(x);return a},{})).map(g=>`<button class="send" onclick="sendOrder('${g.s.id}')"><b class="mono">${g.s.mono}</b><span><small>SEND TO STORE</small><b>${E(g.s.name)}</b></span>→</button>`).join('')}<button class="btn dark" style="width:100%;margin-top:14px" onclick="cart=[];save();go('/order-confirmation')">I’ve sent my message →</button></div>`}</section><aside class="summary"><span class="eye">YOUR ORDER</span>${rs.map(x=>`<div class="mini"><img src="${x.c.images[0]}"><div><b>${E(x.p.name)}</b><p>${E(x.c.name)} · ${E(x.v.n)} · Qty ${x.i.qty}</p></div><b>${money(x.u*x.i.qty)}</b></div>`).join('')}<div class="line total"><span>Total</span><b>${money(sub+data.sett ="${E(data.settings.currency)}"></label><label>Main WhatsApp<input name="wa" value="${E(data.settings.mainWa)}"></label><label>Delivery fee<input type="number" name="delivery" value="${data.settings.delivery}"></label><label class="full">Homepage title<input name="title" value="${E(data.settings.heroTitle)}"></label><label class="full">Announcement<input name="notice" value="${E(data.settings.notice)}"></label><div class="formactions"><button class="btn dark">Save settings</button></div></form>`}

function render(){theme();let p=location.pathname,h=p==='/'?home():p==='/stores'?storesPage():p.startsWith('/store/')?storePage(p.split('/')[2]):p.startsWith('/product/')?productPage(p.split('/')[2]):p==='/cart'?cartPage():p==='/checkout'?checkout():p==='/order-confirmation'?confirmation():p==='/0'||p.startsWith('/0/')?admin():empty();document.querySelector('#app').innerHTML=h;links()}
function filterStores(q){document.querySelector('#stores').innerHTML=data.stores.filter(s=>(s.name+s.city+s.cat).toLowerCase().includes(q.toLowerCase())).map(storeCard).join('');links()}function sortProducts(k,id){let a=data.products.filter(p=>p.store===id);a.sort((x,y)=>k==='low'?(x.sale||x.base)-(y.sale||y.base):k==='high'?(y.sale||y.base)-(x.sale||x.base):0);document.querySelector('#catalog').innerHTML=a.map(productCard).join('');links()}function searchAll(){let q=prompt('Search stores or products');if(!q)return;let s=data.stores.find(x=>x.name.toLowerCase().includes(q.toLowerCase())),p=data.products.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));s?go('/store/'+s.slug):p?go('/product/'+p.slug):toast('No result found')}function setColor(i){ui.color=i;ui.pic=0;ui.size='';render()}function setPic(i){ui.pic=i;render()}function setSize(x){ui.size=x;ui.qty=1;render()}function setQty(n){ui.qty=Math.max(1,ui.qty+n);render()}function addCart(slug){let p=P(slug),c=p.colors[ui.color],v=c.sizes.find(x=>x.n===ui.size);if(!v)return;let h=cart.find(x=>x.product===p.id&&x.color===c.name&&x.size===v.n);h?h.qty+=ui.qty:cart.push({uid:String(Date.now()),product:p.id,color:c.name,size:v.n,qty:ui.qty});save();drawer();toast('Added to bag')}function buyNow(slug){let p=P(slug),s=S(p.store),c=p.colors[ui.color],v=c.sizes.find(x=>x.n===ui.size);if(v)open('https:'+'//wa.me/'+s.wa+'?text='+encodeURIComponent(`Hello ${s.name}, I want ${ui.qty} × ${p.name}, ${c.name}, size ${v.n}, SKU ${v.sku}.`),'_blank')}function cartQty(id,n){let x=cart.find(i=>i.uid===id);x.qty=Math.max(1,x.qty+n);save();location.pathname==='/cart'?render():drawer()}function removeCart(id){cart=cart.filter(x=>x.uid!==id);save();location.pathname==='/cart'?render():drawer()}function reviewOrder(e){e.preventDefault();ui.form=Object.fromEntries(new FormData(e.target));ui.review=true;render()}function sendOrder(id){let rs=cartRows().filter(x=>x.s.id===id),s=S(id),f=ui.form,sub=rs.reduce((n,x)=>n+x.u*x.i.qty,0);let items=rs.map((x,i)=>`${i+1}. Product: ${x.p.name}\nSKU: ${x.v.sku}\nSize: ${x.v.n}\nColor: ${x.c.name}\nQuantity: ${x.i.qty}\nUnit price: ${money(x.u)}\nLine total: ${money(x.u*x.i.qty)}\nLink: ${location.origin}/product/${x.p.slug}`).join('\n\n');let msg=`NEW ORDER REQUEST\n\nCustomer Information\nName: ${f.name}\nPhone: ${f.phone}\nAddress: ${f.address}\nCity: ${f.city}\nNotes: ${f.notes||'None'}\n\nOrder Details\nStore: ${s.name}\n\n${items}\n\nSubtotal: ${money(sub)}\nDelivery: ${money(data.settings.delivery)}\nTotal: ${money(sub+data.settings.delivery)}\n\nPlease confirm availability and delivery.`;data.orders.unshift({id:'ORD-'+Date.now(),name:f.name,total:sub+data.settings.delivery});save();open('https:'+'//wa.me/'+s.wa+'?text='+encodeURIComponent(msg),'_blank');toast('WhatsApp order prepared')}function login(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.user==='Admin'&&f.pass==='2009'){sessionStorage.setItem('admin','1');go('/0/dashboard')}else document.querySelector('#err').textContent='Incorrect credentials'}function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(data.settings,{name:f.name,currency:f.currency,mainWa:f.wa,delivery:Number(f.delivery),heroTitle:f.title,notice:f.notice});save();render();toast('Settings saved')}function addStore(){let name=prompt('Store name');if(!name)return;data.stores.push({id:'s'+Date.now(),slug:name.toLowerCase().replace(/\W+/g,'-'),name,mono:name.split(' ').map(x=>x[0]).join('').slice(0,2),cat:'Fashion',city:'Morocco',rating:5,desc:'New independent store.',cover:'/assets/hero.webp',phone:'',wa:data.settings.mainWa,email:'',address:'',hours:'Mon–Sat'});save();render()}function editStore(id){let s=S(id),name=prompt('Store name',s.name);if(name){s.name=name;s.city=prompt('City',s.city)||s.city;s.wa=prompt('WhatsApp digits',s.wa)||s.wa;save();render()}}function addProduct(){let name=prompt('Product name');if(!name)return;data.products.push({id:'p'+Date.now(),slug:name.toLowerCase().replace(/\W+/g,'-'),store:data.stores[0].id,name,cat:'Fashion',desc:'New product.',base:Number(prompt('Price',500)||500),featured:true,colors:[{name:'Default',hex:'#222',images:['/assets/blazer-black.webp'],sizes:[sz('One size','SKU-'+Date.now(),1)]}]});save();render()}function editProduct(id){let p=data.products.find(x=>x.id===id),name=prompt('Product name',p.name);if(name){p.name=name;p.base=Number(prompt('Price',p.base)||p.base);let json=prompt('Variants JSON',JSON.stringify(p.colors));try{p.colors=JSON.parse(json)}catch{}save();render()}}
window.addEventListener('popstate',render);if(location.hostname.startsWith('admin.')&&location.pathname==='/')history.replaceState({},'', '/0');render();
